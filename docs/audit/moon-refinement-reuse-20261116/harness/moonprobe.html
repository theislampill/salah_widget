<title>Moon refinement reuse probe</title>
<!-- Research probe (Moon-reuse feasibility audit, 2026-11-16). NOT product code.

     The scene is passed as literal numbers so every engine receives bit-identical input. -->

<script>
'use strict';
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
const sha=async view=>hex(await crypto.subtle.digest('SHA-256',view instanceof ArrayBuffer?view:new Uint8Array(view.buffer,view.byteOffset,view.byteLength)));

let SRC=null,SRC_SHA=null;
async function load(){

  (0,eval)(await (await fetch('/moon/src/moon-detail.mjs',{cache:'no-store'})).text()); // projectSurfaceCodes, prefixSurface, boxSurface
}
function variantSource(v){

const workers=new Map();
async function boot(variant){

}
async function digestMsg(m){
  return {rgba:await sha(m.rgba),calendarRgba:await sha(m.calendarRgba),surfaceLinear:await sha(m.surfaceLinear),surfaceCoverage:await sha(m.surfaceCoverage),calendarLinear:await sha(m.calendarLinear)};
}
function diff8(a,b){let n=0,n1=0,n3=0,max=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);if(d){n++;if(d>1)n1++;if(d>3)n3++;if(d>max)max=d;}}return {channelsDiffering:n,channelsOver1:n1,channelsOver3:n3,maxDelta:max};}
function pixdiff8(a,b){let p=0,p1=0,p3=0,max=0;for(let i=0;i<a.length;i+=4){let d=0;for(let k=0;k<4;k++)d=Math.max(d,Math.abs(a[i+k]-b[i+k]));if(d){p++;if(d>1)p1++;if(d>3)p3++;if(d>max)max=d;}}return {pixelsDiffering:p,pixelsOver1:p1,pixelsOver3:p3,maxDelta:max,pixels:a.length/4};}
// Premultiplied (displayed over black) comparison: straight colour of near-transparent limb pixels is ill-conditioned.
function pmdiff8(a,b){let p=0,p1=0,max=0;for(let i=0;i<a.length;i+=4){let d=Math.abs(a[i+3]-b[i+3]);for(let k=0;k<3;k++)d=Math.max(d,Math.abs(Math.round(a[i+k]*a[i+3]/255)-Math.round(b[i+k]*b[i+3]/255)));if(d){p++;if(d>1)p1++;if(d>max)max=d;}}return {pixelsDiffering:p,pixelsOver1:p1,maxDelta:max};}
function proj(m,D){return projectSurfaceCodes({size:m.surfaceSize,linear:m.surfaceLinear,coverage:m.surfaceCoverage,extent:m.surfaceExtent},D);}
function projdiff(a,b){let p=0,pr=0,max=0;const n=a.length/3;for(let i=0;i<n;i++){let d=0,r=false;for(let k=0;k<3;k++){const x=a[3*i+k],y=b[3*i+k];d=Math.max(d,Math.abs(x-y));if(Math.round(x)!==Math.round(y))r=true;}if(d>.5)p++;if(r)pr++;if(d>max)max=d;}return {pixels:n,overHalfCode:p,rounded8bitDiffering:pr,maxCode:max};}
async function render(h,sc,{exportBytes=false}={}){

  const done=await new Promise((res,rej)=>{h.w.onmessage=e=>{const m=e.data;if(m.id!==id&&m.kind!=='boot-error')return;
      if(m.kind==='progress')return;if(m.kind==='error'||m.kind==='boot-error'){rej(new Error(m.error));return;}
      m.at=performance.now()-t0;msgs.push(m);if(m.kind==='result')res(m);};
    h.w.postMessage({kind:'render',id,identity:{id},scene:s});});
  const out={scene:sc.name,variant:h.variant,ms:done.at,quality:done.diagnostics.quality,rowScheduling:done.diagnostics.rowScheduling,physicalIdentity:done.physicalIdentity,profileIdentity:done.profileIdentity,
    hashes:await digestMsg(done),previews:[]};
  for(const m of msgs.filter(x=>x.kind==='preview'))out.previews.push({at:m.at,samples:m.diagnostics.quality.samples,hashes:await digestMsg(m)});

    out.steps=[];

      for(const D of [108,216,312])st.projectedVsFinal[D]=projdiff(proj(m,D),fin[D]);
      out.steps.push(st);

}
// Engine Math fingerprint: the kernel imports these JS functions (moon_kernel.c L9-12) and the scene/tone map use them.

window.probe={load,boot,render,mathFingerprint,info:async()=>{await load();return {workerSha256:SRC_SHA,ua:navigator.userAgent,dpr:devicePixelRatio,cores:navigator.hardwareConcurrency};}};
