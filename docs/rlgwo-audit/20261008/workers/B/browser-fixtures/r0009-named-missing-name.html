  if(!_setCandOwner || !_ownsSetLookup(_setCandOwner)) return;
  const c=_setCands[_setCandIdx]; if(!c) return;
  _byId("set-lat").value=(+c.lat).toFixed(5);
  _byId("set-lon").value=(+c.lon).toFixed(5);
  if(c.name) _byId("set-label").value=c.name;                 // display name follows the chosen place (override later with Shift+Enter)
  _setLocationEvidence=window.SalahConfig?SalahConfig.placeLocationEvidence(c):null; _setLocationOrigin="place"; _setLocationSaved=false;
  _setCandOwner.label=_byId("set-label").value;              // cycling owns its programmatic display-name update
  _setPin("manual"); _setDirty=true;                          // a searched place is a user choice, not live sensing → grey pin
  _setStatus(_setCands.length>1
    ? ("Match "+(_setCandIdx+1)+" of "+_setCands.length+": "+c.norm+"\npress Enter to cycle")
    : ("Found: "+c.norm));
}
// date format: keep the preset dropdown in sync with the editable code box (mirrors builder.html)
const _DF_PRESETS=["YYYY-MM-DD","MM/DD/YYYY","DD/MM/YYYY","DD MMMM YYYY"];
function _syncDateFromBox(){ const dd=_byId("set-datefmt-preset"); if(!dd) return; const code=_byId("set-datefmt").value.trim(); dd.value=(_DF_PRESETS.indexOf(code)>=0)?code:"__custom__"; }

function _enableSettingsAffordance(){
  const b=document.querySelector(".buckle"); if(!b) return;
  const c=document.querySelector(".c"); if(c) c.classList.add("cfg-local");
  if(b.classList.contains("interactive")) return;             // idempotent
  b.classList.add("interactive");
  b.setAttribute("role","button"); b.setAttribute("tabindex","0"); b.setAttribute("aria-label","Widget settings");
  if(!b.querySelector(".gear")){ const g=document.createElement("span"); g.className="gear"; g.textContent="⚙"; g.setAttribute("aria-hidden","true"); b.appendChild(g); }
  _renderPersistenceAffordance();
  b.addEventListener("click",_toggleSettings);
  b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); _toggleSettings(); } });
}

function _settingsFormToConfig(){
  const g=_byId, base={ lat:g("set-lat").value.trim(), lon:g("set-lon").value.trim(),
    label:g("set-label").value.trim(), method:g("set-method").value, school:g("set-school").value,
    time:g("set-time").value, units:g("set-units").value,
    appearance:g("set-appearance").value,
    datefmt:g("set-datefmt").value.trim()||"YYYY-MM-DD",
    tz:(CONFIG&&CONFIG.tz)||tz, lp:LPOLL, locationEvidence:_setLocationEvidence,
    source:_setLocationOrigin };
  return window.SalahConfig ? SalahConfig.normalize(base) : base;
}
function _populateSettingsForm(){
  const g=_byId;
  g("set-lat").value = lat!=null?lat:""; g("set-lon").value = lon!=null?lon:"";
  g("set-label").value = label||""; g("set-method").value=method; g("set-school").value=school;
  g("set-time").value=fmt24?"24":"12"; g("set-units").value=units; g("set-datefmt").value=datefmtStr;
  g("set-appearance").value=(CONFIG&&CONFIG.appearance)||"glass";
  _syncDateFromBox();
  _setLocationEvidence=window.SalahConfig?SalahConfig.normalize(CONFIG||{}).locationEvidence:null;
  _setLocationOrigin=(CONFIG&&(CONFIG.origin||CONFIG.source))||"manual"; _setLocationSaved=!!CONFIG&&CONFIG.source==="localStorage";
  const intent=_setLocationEvidence&&_setLocationEvidence.intent;
  _setPin(intent==="device-position"?"precise":(intent==="coarse-area"?"ip":"manual"));
  _setCands=[]; _setCandOwner=null; _setSearchSeq++; _setDirty=false; // fresh open: nothing to auto-save yet
  _setStatus("Enter to search a place · Shift+Enter to keep the typed name.");
}
function _wireSettings(){
  if(_setWired) return; _setWired=true;
  _byId("setClose").addEventListener("click",_closeSettings);
  _byId("set-pin").addEventListener("click",_usePrecise);     // one-shot browser position (asks permission)
  _byId("set-reset").addEventListener("click",_resetLocal);
  // AUTO-SAVE (no Save button): any edit marks the form dirty → committed on close. Esc closes; Tab is trapped.
  const panel=_byId("settings");
  panel.addEventListener("input",_recordSetEdit);
  panel.addEventListener("change",_recordSetEdit);
  panel.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ e.preventDefault(); _closeSettings(); return; }
    if(e.key==="Tab"){                                         // focus trap — keep Tab inside the dialog
      const f=[...panel.querySelectorAll('a[href],button,input,select,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled && el.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });
  // Name edits preserve acquisition; coordinate edits select a manual site.
  ["set-label","set-lat","set-lon"].forEach(id=>_byId(id).addEventListener("input",()=>{
    _invalidateSetLocation();
    if(id!=="set-label"){
      _setLocationEvidence=window.SalahConfig?SalahConfig.normalize({source:"manual"}).locationEvidence:null;
      _setLocationOrigin="manual"; _setLocationSaved=false; _setPin("manual");
    }
    _setStatus("Enter to search a place · Shift+Enter to keep the typed name.");
  }));
  // date format: preset dropdown <-> editable code box (mirrors builder.html)
  _byId("set-datefmt-preset").addEventListener("change",()=>{ const v=_byId("set-datefmt-preset").value; if(v!=="__custom__") _byId("set-datefmt").value=v; else _byId("set-datefmt").focus(); });
  _byId("set-datefmt").addEventListener("input",_syncDateFromBox);
  // LOCATION field — the display NAME and the actual coordinates are stored separately (config.label vs
  // lat/lon), so each can be overridden independently. Enter = search the typed place (cycle matches) →
  // sets the ACTUAL location/coordinates. Shift+Enter = keep the typed text as the DISPLAY NAME only,
  // WITHOUT searching (coordinates unchanged — e.g. force "Central Florida" over a precise location).
  const lab=_byId("set-label");
  lab.addEventListener("keydown",(e)=>{
    if(e.key!=="Enter") return;
    e.preventDefault();
    if(e.shiftKey){                                            // Shift+Enter → display-name override (no search)
      _invalidateSetLocation(); const nm=lab.value.trim(); _setDirty=true;
      _setStatus(nm ? ("Display name “"+nm+"” — coordinates unchanged.")
                    : "Type a place and press Enter to search.");
      return;
    }
    if(_setCands.length>1 && _setCandOwner && _ownsSetLookup(_setCandOwner) && _setCandOwner.label===lab.value){ _setCandIdx=(_setCandIdx+1)%_setCands.length; _showSetCand(); return; }
    _setCands=[]; _setCandOwner=null;
    const q=lab.value.trim();
    if(q.length>=2) _runSetSearch(q);                          // Enter → search the typed place
  });
}
// AUTO-SAVE: there is no Save button — the current form is applied + persisted when the panel closes
// (only if something changed and the coordinates are valid). Storage blocked → applies for the session.
function _commitSettings(){
  if(!_setDirty) return;
  const cfg=_settingsFormToConfig();
  const v=window.SalahConfig?SalahConfig.validate(cfg):{ok:cfg.lat!=null&&cfg.lon!=null};
  if(!v.ok) return;                                            // incomplete/invalid → keep the prior config
  _setDirty=false;
  applyConfig(cfg,{save:true});                                // persist + re-fetch + re-render (fire-and-forget)
}
async function _usePrecise(){    // the map-pin button → precise GPS (only place getCurrentPosition is called)
  _invalidateSetLocation(); const owner=_captureSetLookup();
  if(!window.SalahConfig){ _setStatus("Browser location unavailable.",true); return; }
  _setStatus("Requesting browser location…");
  let r; try{ r=await SalahConfig.geolocate({}); }catch(e){ r={ok:false,error:"unavailable"}; }
  if(!_ownsSetLookup(owner)) return;
  let permission=_geoPermission; try{ permission=await SalahConfig.permissionState(); }catch(e){}
  if(!_ownsSetLookup(owner)) return;
  _geoPermission=permission;
  if(r.ok){ _byId("set-lat").value=(+r.lat).toFixed(5); _byId("set-lon").value=(+r.lon).toFixed(5); _geoLastError=null;
    _setLocationEvidence=r.locationEvidence||SalahConfig.normalize({source:"browser-geolocation"}).locationEvidence; _setLocationOrigin="browser-geolocation"; _setLocationSaved=false;
    _setPin("precise"); _setDirty=true;
    _setStatus(_byId("set-pin").title); }
  else { _geoLastError=r.error||"denied";
    _setStatus(r.error==="unsupported" ? "Geolocation isn't available in this browser/iframe." :
      "Browser location unavailable ("+(r.error||"denied")+"). Type a place + Enter, or keep the selected location.", true); }
}
async function _resetLocal(){
  _invalidateSetLocation(); const owner=_captureSetLookup(), prefOwner={..._setPrefVersions};
  const r=window.SalahConfig?SalahConfig.clearLocal():{ok:false,error:"unavailable"};
  _publishPersistence("reset",r);
  if(!r.ok){
    _setStatus("Enter to search a place · Shift+Enter to keep the typed name."); return; // the reset also cancelled any pending lookup
  }
  _setStatus("Detecting your area…");
  let d=null; try{ if(window.SalahConfig) d=await SalahConfig.coarseDetect(); }catch(e){}
  if(!_ownsSetLookup(owner)) return;
  if(d&&d.ok){ const c=SalahConfig.applyHashPrefs(d.cfg,_hashCfg);
    // Reset still owns the detected location, while preferences edited since
    // dispatch (or during apply's await) own their fields and their close-save.
    Object.assign(c,_newerSetPrefs(prefOwner));
    await applyConfig(c,{save:false});
    if(!_ownsSetLookup(owner)) return;
    const prefs=_newerSetPrefs(prefOwner);
    _populateSettingsForm();
    Object.entries(prefs).forEach(([key,value])=>{ _byId(_SET_PREF_IDS[key]).value=value; });
    _syncDateFromBox(); _setDirty=Object.keys(prefs).length>0;
    _setStatus("Using estimated area: "+(d.cfg.area||d.cfg.label||"")); }
  else { _setStatus("Enter your location.",true); }
}
function _openSettings(){
  const c=document.querySelector(".c"); if(!c) return;
  _setSession++; _setOpen=true; _invalidateSetLocation();
  _wireSettings(); _populateSettingsForm();
  _setLastFocus=document.activeElement;
  const b=document.querySelector(".buckle"); if(b) b.setAttribute("tabindex","-1");   // covered while open → out of the tab order (focus trap)
  c.classList.add("settings-open");
  clearTimeout(_setFocusTimer);
  const session=_setSession, first=_byId("set-label"); if(first) _setFocusTimer=setTimeout(()=>{ if(_setOpen && session===_setSession){ try{ first.focus(); }catch(e){} } },30);
}
function _closeSettings(){
  const c=document.querySelector(".c"); if(!c) return;
  _setOpen=false; _setSession++; _invalidateSetLocation(); clearTimeout(_setFocusTimer);
  _commitSettings();                                          // AUTO-SAVE on close
  c.classList.remove("settings-open");
  const b=document.querySelector(".buckle");
  if(b){ b.setAttribute("tabindex","0"); }                    // restore to the tab order
  if(b&&b.classList.contains("interactive")){ try{ b.focus(); }catch(e){} }
  else if(_setLastFocus&&_setLastFocus.focus){ try{ _setLastFocus.focus(); }catch(e){} }
}
function _toggleSettings(){ const c=document.querySelector(".c"); if(!c) return; c.classList.contains("settings-open")?_closeSettings():_openSettings(); }

// Authored MB1 boundary: this is the only producer of native phase/time identity.
window.SalahMoonHost=Object.freeze({
 capture(){
  const identity=skySceneIdentity();
  return {utcMs:simNow(),generation:_runtimeGeneration,sceneIdentity:identity,
   fraction:moonSky.frac,waxing:!!moonSky.waxing,up:moonSky.up,
   maximumPresentationRatio:MOON_SCALE_MAX/(MOON_SCALE_MIN+(MOON_SCALE_MAX-MOON_SCALE_MIN)*clamp(moonSky.up)),
   dpr:Math.max(.5,Math.min(4,window.devicePixelRatio||1)),timeScale:TIMESCALE,
   paused:document.hidden||!!$('.c')?.classList.contains('paused')};
 },
 publish(canvas){const ph=$('.mphoto');if(ph)ph.setAttribute('href',canvas.toDataURL());updateSkySurface();},
 fallback(){
  // Resilience means a usable widget and retry, not silently substituting the
  // old Moon. The mask follows the same admission as the material surface.
  updateSkySurface();
 },
});

// CP8 host owns time/config/weather acceptance; the optional renderer only reads this boundary.
// CP9: independent custody of an elevation admitted for this exact native target.
// The native legacy scalar is not reused as accepted astronomical metadata.
let _cp9SiteElevation=null;
window.SalahNativeSkyHost=Object.freeze({
 acceptedElevation(heightM,generation,latitude,longitude){
  if(typeof heightM!=='number'||!Number.isFinite(heightM)||heightM<-500||heightM>10000||generation!==_runtimeGeneration||latitude!==lat||longitude!==lon)return false;
  _cp9SiteElevation=Object.freeze({heightM,generation,lat:latitude,lon:longitude});return true;
 },
 lunarSurface(){return window.SalahMoonRuntime?.surface()??null;},
 cloudLighting(){return window.SalahNativeCloudLighting?.(this.capture(false))??null;},
 capture(includePresentation=true){
  const identity=simulationReady()?skySceneIdentity():null;
  const cw=selectedWeather();
  const elevation=cw&&_cp9SiteElevation&&_cp9SiteElevation.generation===_runtimeGeneration&&_cp9SiteElevation.lat===lat&&_cp9SiteElevation.lon===lon?_cp9SiteElevation:null;
  const cameraNumber=(name,fallback)=>q.has(name)?(q.get(name).trim()===''?NaN:Number(q.get(name))):fallback;
  const card=$('.c');let solarAnchor=null;
  // Cloud lighting consumes physical direction, never decorative-body layout.
  // Avoid forcing CSS layout on every native cloud/atmosphere update. The
  // default renderer boundary still measures the actually presented body.
  if(includePresentation){
  const body=$('.sunbody'),attached=$('.suncorner'),sx=parseFloat(card?.style.getPropertyValue('--sunx2')),sy=parseFloat(card?.style.getPropertyValue('--sunlift'));
  // The native transform is eased by CSS. Register attached light to the
  // centre actually presented now, not the future --sunlift target. This is
  // presentation metadata only; no astronomical UTC/identity is substituted.
  const br=body?.getBoundingClientRect?.(),vr=($('.real-sky-canvas')??$('.real-sky-preview'))?.getBoundingClientRect?.();
  const actual=br&&vr&&vr.width>0&&vr.height>0&&Number.isFinite(br.left)&&Number.isFinite(br.top)?{x:(br.left+br.width/2-vr.left)*325/vr.width,y:(br.top+br.height/2-vr.top)*530/vr.height}:null;
  const presence=attached&&typeof getComputedStyle==='function'?Number(getComputedStyle(attached).opacity):null;
  solarAnchor=Number.isFinite(sx)&&Number.isFinite(sy)?{...(actual??{x:sx,y:sy}),...(Number.isFinite(presence)?{presence}: {})}:null;
  }
  return {utcMs:simNow(),lat,lon,heightM:elevation?.heightM??0,elevationSource:elevation?'native response elevation bound to this target generation':'default zero; no bound eligible weather height',elevationOwner:elevation?{...elevation}:null,generation:_runtimeGeneration,sceneIdentity:identity,
   tz,timeScale:TIMESCALE,units,lp:LPOLL,reducedMotion:isMotionReduced(),paused:document.hidden||!!$('.c')?.classList.contains('paused'),
   camera:{azDeg:cameraNumber('skyAz',180),altDeg:cameraNumber('skyAlt',45),fovYDeg:cameraNumber('skyFov',90),rollDeg:cameraNumber('skyRoll',0)},allowEstimates:q.get('skyEstimates')!=='off',
   weather:cw?{src:cw.src??'accepted-native',temp:cw.temp??null,rh:cw.rh??null,vis:cw.vis??null,cloud:cw.cloud??null,code:cw.code??null,wind:cw.wind??null}:null,
   solarAnchor,
   // Numerical/currentness reads must not query layout or publish a lunar
   // texture. surface() does both; after sky DOM writes that forced layout
   // consumed the remaining fast-clock publication budget. Read the real
   // lunar owner only for the full presentation/diagnostic snapshot.
   prayerReady:!!today,moonReady:includePresentation?!!window.SalahMoonRuntime?.surface():null,pbrFailed:_pbrFailed};
 },
 // Preview has its own accepted-input/expiry check on every animation frame.
 // A synchronous second producer here ran during native paint, before clouds,
 // then repeated in that same frame at high rates. Bootstrap still paints
 // immediately; target changes remain fenced by beginSkyScene and preview rAF.
 notify(){window.SalahRealSky?.request();}
});
// CP9 additive diagnostic join, adopted from the donor's native-QA integration.
// Original prayer/weather/calendar fields remain untouched; this is not render authority.
if(typeof window.qaState==='function'){
 const nativeQA=window.qaState;
 window.qaState=function(...args){
  const original=nativeQA.apply(this,args);let realSky;
  try{const s=window.realSkyState?.();realSky=s?{checkpoint:s.checkpoint,status:s.status,renders:s.renders,frameUtcMs:s.last?.utcMs??null,catalogue:s.last?.catalogue??null,generation:s.last?.native?.generation??null,assumptions:s.last?.native?.assumptions??null,composition:s.last?.composition??null,errors:s.errors??[]}:{checkpoint:'9',status:'loading',frameUtcMs:null};}
  catch(e){realSky={checkpoint:'9',status:'unavailable',frameUtcMs:null,error:String(e?.message??e)};}
  const m=window.SalahMoonRuntime?.state;
  const moonRenderer=m?{backend:m.backend,status:m.status,quality:m.quality,legacyFallback:m.legacyFallback,currentNativeFraction:m.currentNativeFraction,renderedFraction:m.accepted?.scene?.fraction??null,calendarProxyWeight:m.calendarProxyWeight,profile:m.accepted?.profile??null,errors:m.errors}:null;
  return {...original,realSky,moonRenderer,legacySyntheticStarTelemetry:{active:false,replacement:'realSky; raster diagnostics, not old synthetic DOM arrays'}};
 };
}

// TEST-ONLY admitted-state mismatches after real admission. The production clock/model stay intact.
const calendarFixtureRender=render;
render=function(){
  const fixture=window.__calendarFixture;
  if(fixture.injectedNext && tomorrow)tomorrow=structuredClone(fixture.injectedNext);
  if(fixture.stale)_prayerStale=true;
  const result=calendarFixtureRender();fixture.renders++;
  fixture.ready=!!today && document.querySelectorAll('.p').length===6;
  return result;
};
window.__calendarFixture.render=()=>render();
window.__calendarFixture.admittedState=(current,next)=>{today=current;tomorrow=next;fetchingTomorrow=true;render();};

boot().then(()=>setTimeout(render,0));
