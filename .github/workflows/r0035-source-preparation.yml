      - name: Receive complete immutable original research inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55d1b3edb66d2c35679707120b01ee1d3455e4a3
          path: research
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /real-sky/
            /tools/
            /moon/
            /vendor/
            /v1/
            /tests/
            /docs/state-contracts/evidence/R0040/phase1-options.patch.gz
      - name: Receive complete immutable original baseline inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df644ef60156b67b5c487395176369bcec7a0d7b
          path: baseline
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /real-sky/
            /tools/
            /moon/
            /vendor/
            /v1/
            /tests/
            /index.html
            /offline.html
            /config.js
            /builder.html
            /GENERATED.json
            /.gitignore
      - name: Receive immutable historical helper closure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4029d2f67f5a880c8ad889443bb7557d96022c45
          path: historical
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/qa/precip_eval_lib.cjs
            /tools/qa/precip_models_geom.js
            /tools/qa/precip_declared_gain.json
            /tools/qa/precip_models.js
            /tools/qa/precip_models_capture.cjs
            /tools/qa/precip_models_post.py
      - name: Create fresh private source-only task
        id: private
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_task="$RUNNER_TEMP/salah-source-preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$source_task"
          mkdir "$source_task/records" "$source_task/capture" "$source_task/work"
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - name: Run genuine original source preparation and native refusal
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          source_task="$RUNNER_TEMP/salah-source-preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if python3 -B source-preparation/tools/qa/hosted-native/r0035_source_preparation.py run --task "$source_task" --workspace "$GITHUB_WORKSPACE" > "$source_task/records/coordinator.stdout" 2> "$source_task/records/coordinator.stderr"; then
            echo 'SOURCE_PREPARATION_COMPLETE; NATIVE_NOT_RUN'
          else
            echo 'SOURCE_PREPARATION_INCOMPLETE; detail remains private'
            exit 1
          fi
      - name: Seal all obtained source-only evidence in bounded raw shards
        id: seal
        if: always() && steps.private.outputs.created == 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          source_task="$RUNNER_TEMP/salah-source-preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if python3 -B source-preparation/tools/qa/hosted-native/r0035_source_preparation.py seal --task "$source_task" --workspace "$GITHUB_WORKSPACE" > "$source_task/seal.stdout" 2> "$source_task/seal.stderr"; then
            echo 'sealed=true' >> "$GITHUB_OUTPUT"
            echo 'SOURCE_ONLY_ENVELOPE_SET_SEALED'
          else
            echo 'SOURCE_ONLY_SEALING_FAILED; no plaintext artifact may be uploaded'
            exit 1
          fi
      - name: Retain only the encrypted index and bounded encrypted shards
        if: always() && steps.seal.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: salah-source-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/salah-source-preparation-${{ github.run_id }}-${{ github.run_attempt }}/sealed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove private source-only plaintext after retention attempt
        if: always() && steps.private.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_task="$RUNNER_TEMP/salah-source-preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$source_task"
          echo 'SOURCE_ONLY_PRIVATE_PLAINTEXT_REMOVED'
