name: R0016 actual Linux 22.04 installer qualification

on:
  push:
    branches:
      - pro/r0016-effect-free-preview-20261111
    paths:
      - install.sh
      - tests/install-preview.py
      - tests/install-entry-bash.py
      - tests/install-bash.py
      - tests/install-discovery.py
      - tests/install-detectors.py
      - tests/install-discovery-mutations.py
      - tests/install-mutations.py
      - tests/install-staging-native.py
      - tests/install-linux-owner.py
      - tests/install-builder.cjs
      - src/native/builder.html
      - src/native/config.js
      - tools/qualification/installer_native.py
      - tools/qualification/installer_preview_linux22_prerequisites.py
      - .github/workflows/installer-preview-linux22-native.yml

permissions:
  contents: read

concurrency:
  group: installer-preview-linux22-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.sh
            /install.ps1
            /presets/
            /src/native/builder.html
            /src/native/config.js
            /tests/install*
            /tools/qualification/installer_native.py
            /tools/qualification/installer_preview_linux22_prerequisites.py
      - name: Acquire signed jammy containment prerequisite before qualification
        shell: bash
        run: |
          python3 tools/qualification/installer_preview_linux22_prerequisites.py --output "$RUNNER_TEMP/installer-linux22-preparation"
      - name: Execute full native R0016 matrix with unchanged Linux containment
        shell: bash
        run: |
          python3 tools/qualification/installer_native.py --expected-os Linux --phase r0016 --output "$RUNNER_TEMP/installer-evidence"
      - name: Package original native evidence without changing fixture names
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          parent = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = parent / 'installer-evidence'
          root.mkdir(exist_ok=True)
          preparation = parent / 'installer-linux22-preparation'
          if preparation.is_dir():
              retained = root / 'runner-preparation'
              retained.mkdir()
              inventory = []
              for path in sorted(preparation.iterdir()):
                  if path.is_file() and not path.is_symlink():
                      raw = path.read_bytes()
                      (retained / path.name).write_bytes(raw)
                      inventory.append({'name': path.name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'retained': True})
                  elif path.is_dir() and not path.is_symlink() and path.name in ('apt-lists', 'apt-cache', 'empty-config-parts'):
                      inventory.append({'name': path.name, 'retained': False, 'reason': 'Disposable APT index/cache/empty directory; exact preparation configuration and raw streams retained. No diagnostic fixture path is excluded.'})
                  else:
                      raise RuntimeError('Unexpected preparation entry type: ' + path.name)
              (retained / 'archive-inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
          with tarfile.open(root.with_suffix('.tar.gz'), 'w:gz', dereference=False) as archive:
              archive.add(root, arcname='installer-evidence')
          PY
      - name: Retain original Linux qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r0016-native-Linux22-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30
