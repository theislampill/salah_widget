name: Installer Windows failure diagnosis

on:
  push:
    branches:
      - pro/r0015-explicit-artifact-transactions-20261106
    paths:
      - tools/qualification/windows_installer_probe.py
      - tools/qualification/windows_installer_probe.ps1
      - .github/workflows/installer-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: installer-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      POWERSHELL_UPDATECHECK: 'Off'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.sh
            /install.ps1
            /presets/
            /tools/qualification/windows_installer_probe.py
            /tools/qualification/windows_installer_probe.ps1
      - name: Acquire exact supported PowerShell 7 bytes
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') { throw 'PowerShell runtime digest mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'installer-pwsh7'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          "INSTALL_TEST_PS7=$(Join-Path $runtime 'pwsh.exe')" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Observe isolated compiler and path failures
        shell: powershell
        run: |
          python tools/qualification/windows_installer_probe.py --output (Join-Path $env:RUNNER_TEMP 'installer-diagnostic')
          exit $LASTEXITCODE
      - name: Package original diagnostic evidence without cleanup
        if: always()
        shell: powershell
        run: |
          python tools/qualification/windows_installer_probe.py --archive --output (Join-Path $env:RUNNER_TEMP 'installer-diagnostic')
          exit $LASTEXITCODE
      - name: Retain original native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-diagnostic-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-diagnostic.tar.gz
          if-no-files-found: error
          retention-days: 30
