name: R0039 installer discriminators (Windows)

# R0039 (issue 106) rows R39-07 (B1: helper-type reuse under the installer's own compiler custody) and R39-08
# (B2: -NonInteractive and ended-input acknowledgement, end to end through the hand-off). They need a Windows
# host whose TEMP ancestry the installer admits, which GitHub's windows-2022/windows-2025 runners are (R0015).
# Fixtures only: tests/r0039-installer-probes.py redirects every installer write under $RUNNER_TEMP, serves
# release metadata and downloads from in-process spies, keeps Read-Host real, installs nothing and starts no
# browser. install.ps1 is read, never modified. Contract and expected observations: docs/state-contracts/R0039.md.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/r0039-*'
    paths:
      - .github/workflows/r0039-installer-probes.yml
      - install.ps1
      - presets/**
      - tests/r0039-*

permissions:
  contents: read

concurrency:
  group: r0039-installer-probes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        host: [ps51, ps7]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      POWERSHELL_UPDATECHECK: 'Off'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PROBE_HOST: ${{ matrix.host }}
      PROBE_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.ps1
            /presets/
            /tests/r0039-*
      - name: Acquire exact supported PowerShell 7 bytes
        if: matrix.host == 'ps7'
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') { throw 'PowerShell runtime digest mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'installer-pwsh7'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          "INSTALL_TEST_PS7=$(Join-Path $runtime 'pwsh.exe')" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the R39-07 and R39-08 discriminators against fixtures
        shell: powershell
        run: |
          $exe = if ($env:PROBE_HOST -eq 'ps7') { $env:INSTALL_TEST_PS7 } else { Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe' }
          # Fixture parent: a new current-user-owned protected directory inside the real TEMP (precedent:
          # installer-environment-observation.yml). $RUNNER_TEMP (D:\a\_temp) has an ancestry the installer's
          # compiler and staging custody refuse, which made run 43481353518 a harness GAP.
          $fixtures = Join-Path $env:TEMP ('r0039-fixtures-' + $env:PROBE_HOST)
          [void][IO.Directory]::CreateDirectory($fixtures)
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = New-Object Security.AccessControl.DirectorySecurity
          $acl.SetAccessRuleProtection($true, $false); $acl.SetOwner($sid)
          $acl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule($sid, [Security.AccessControl.FileSystemRights]::FullControl, [Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit', [Security.AccessControl.PropagationFlags]::None, [Security.AccessControl.AccessControlType]::Allow)))
          Set-Acl -LiteralPath $fixtures -AclObject $acl
          $out = Join-Path $env:RUNNER_TEMP 'r0039-receipt'
          [void][IO.Directory]::CreateDirectory($out)
          $receipt = Join-Path $out ('r0039-' + $env:PROBE_RUNNER + '-' + $env:PROBE_HOST + '.json')
          python tests/r0039-installer-probes.py --host-name $env:PROBE_HOST --host-exe $exe --source install.ps1 --preset presets/salah-widget.tablissng.json --fixture-parent $fixtures --output $receipt
          exit $LASTEXITCODE
      - name: Retain the receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r0039-probes-${{ matrix.runner }}-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r0039-receipt/
          if-no-files-found: error
          retention-days: 30
