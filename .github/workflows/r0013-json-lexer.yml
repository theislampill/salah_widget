name: R0013 JSON lexer native evidence
on:
  push:
    branches: [pro/r0013-json-lexer-linear-20261112]
    paths:
      - install.ps1
      - tests/install-json-lexer*
      - .github/workflows/r0013-json-lexer.yml
permissions:
  contents: read
concurrency:
  group: r0013-json-lexer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        version: ['5.1', '7.6.6', '7.6.9']
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.ps1
            /tests/install-json-lexer*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8013b4404b55f21b43b7e62456fd24e15881b7fd
          path: baseline
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /install.ps1
      - name: Select exact native runtime
        shell: powershell
        run: |
          $version = '${{ matrix.version }}'
          if ($version -eq '5.1') {
            $exe = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          } else {
            $digests = @{
              '7.6.6' = '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860'
              '7.6.9' = 'ce7484804c0f0ad4dda10c958e71acdaf7eebfb22505c1b480f89e0e9f1da94d'
            }
            $archive = Join-Path $env:RUNNER_TEMP ('PowerShell-'+$version+'-win-x64.zip')
            Invoke-WebRequest -UseBasicParsing -Uri ('https://github.com/PowerShell/PowerShell/releases/download/v'+$version+'/PowerShell-'+$version+'-win-x64.zip') -OutFile $archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digests[$version]) { throw 'Native runtime digest mismatch' }
            $runtime = Join-Path $env:RUNNER_TEMP ('r0013-pwsh-'+$version)
            Expand-Archive -LiteralPath $archive -DestinationPath $runtime
            $exe = Join-Path $runtime 'pwsh.exe'
          }
          "R0013_LEXER_PS=$exe" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Receive bounded original and candidate lexer observations
        shell: powershell
        run: |
          python candidate/tests/install-json-lexer-native.py --repo candidate --baseline baseline/install.ps1 --powershell $env:R0013_LEXER_PS --version '${{ matrix.version }}' --output (Join-Path $env:RUNNER_TEMP 'r0013-lexer-evidence')
          exit $LASTEXITCODE
      - name: Package original evidence
        if: always()
        shell: powershell
        run: |
          python -c "import os,pathlib,tarfile; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'r0013-lexer-evidence'; assert p.is_dir(); z=tarfile.open(p.with_suffix('.tar.gz'),'w:gz',dereference=False); z.add(p,arcname='r0013-lexer-evidence'); z.close()"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r0013-lexer-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r0013-lexer-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30
