# Staging-parent environment observation.
#
# Records how hosted runner environments look to the installers' own
# staging-parent admission functions: owner/ACL facts for the profile and
# temporary directories on Windows, temporary-directory path facts on macOS
# and Linux, and the installer functions' accept/refuse result for each.
# The scripts live in tools/qualification/environment-observation/; each job
# uploads one JSON per host. Observation only: every script exits 0 on a
# refusal, no installer entry contacts the network, and no browser, store page
# or clipboard is used. No existing workflow is changed.
name: Installer environment observation

on:
  push:
    branches:
      - claude/installer-env-diagnostics-*
    paths:
      - .github/workflows/installer-environment-observation.yml
      - tools/qualification/environment-observation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-environment-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      POWERSHELL_UPDATECHECK: 'Off'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.ps1
            /presets/
            /tools/qualification/environment-observation/
      - name: Acquire exact supported PowerShell 7 bytes
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') { throw 'PowerShell runtime digest mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'installer-pwsh7'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          "INSTALL_TEST_PS7=$(Join-Path $runtime 'pwsh.exe')" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Observe staging parents on both PowerShell hosts
        shell: powershell
        run: |
          # Child stderr is recorded by the scripts; it must not stop this step.
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'environment-observation'
          [void][IO.Directory]::CreateDirectory($out)
          $env:OBSERVED_INSTALL_PS1_BLOB = (git rev-parse HEAD:install.ps1)
          $hosts = @(@('ps51', (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe')), @('ps7', $env:INSTALL_TEST_PS7))
          foreach ($h in $hosts) {
            & $h[1] -NoProfile -File tools/qualification/environment-observation/windows_observation.ps1 -SourceFile (Resolve-Path install.ps1).Path -OutputFile (Join-Path $out ('functions-' + $h[0] + '.json')) -FixtureParent $env:RUNNER_TEMP
            python tools/qualification/environment-observation/windows_end_to_end.py --source install.ps1 --preset presets/salah-widget.tablissng.json --host-name $h[0] --host-exe $h[1] --fixture-parent $env:RUNNER_TEMP --output (Join-Path $out ('entry-' + $h[0] + '.json'))
            # Same entry with TEMP = a new current-user-owned protected directory inside the
            # real TEMP; USERPROFILE stays real. The directory is removed afterwards.
            $ownedTemp = Join-Path $env:TEMP ('envobs-owned-temp-' + $h[0])
            [void][IO.Directory]::CreateDirectory($ownedTemp)
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $acl = New-Object Security.AccessControl.DirectorySecurity
            $acl.SetAccessRuleProtection($true, $false); $acl.SetOwner($sid)
            $acl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule($sid, [Security.AccessControl.FileSystemRights]::FullControl, [Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit', [Security.AccessControl.PropagationFlags]::None, [Security.AccessControl.AccessControlType]::Allow)))
            Set-Acl -LiteralPath $ownedTemp -AclObject $acl
            python tools/qualification/environment-observation/windows_end_to_end.py --source install.ps1 --preset presets/salah-widget.tablissng.json --host-name $h[0] --host-exe $h[1] --fixture-parent $env:RUNNER_TEMP --temp-override $ownedTemp --output (Join-Path $out ('entry-owned-temp-' + $h[0] + '.json'))
            try { [IO.Directory]::Delete($ownedTemp, $true) } catch { "owned TEMP removal failed: $($_.Exception.Message)" | Out-File -LiteralPath (Join-Path $out ('owned-temp-removal-' + $h[0] + '.txt')) }
          }
          exit 0
      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-observation-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment-observation
          if-no-files-found: error
          retention-days: 30
  posix:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /install.sh
            /tests/install-staging-native.py
            /tools/qualification/environment-observation/
      - name: Observe staging parents for this tree's and main's install.sh
        shell: bash
        run: |
          out="$RUNNER_TEMP/environment-observation"
          mkdir -p "$out"
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:install.sh > "$RUNNER_TEMP/main-install.sh"
          printf 'main_commit=%s\nmain_install_sh_blob=%s\ntree_commit=%s\ntree_install_sh_blob=%s\n' "$(git rev-parse origin/main)" "$(git rev-parse origin/main:install.sh)" "$(git rev-parse HEAD)" "$(git rev-parse HEAD:install.sh)" > "$out/sources.txt"
          python3 tools/qualification/environment-observation/posix_observation.py \
            --source tree=install.sh --source "main=$RUNNER_TEMP/main-install.sh" \
            --repo-root . --fixture-parent "$RUNNER_TEMP" --output "$out/posix-${{ matrix.runner }}.json"
      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-observation-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment-observation
          if-no-files-found: error
          retention-days: 30
