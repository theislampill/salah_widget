<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prayer Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Typography is optional: a slow font service cannot delay accepted sky/UI inputs.
     The same stylesheet and existing fallback stack apply when it is available. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:#fff7df;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  font:14px var(--font-body);font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.c{
  --g1:#0b1430;--g2:#070a1c;--g3:#0d1024;
  --glow:rgba(70,90,180,0);--horizon:rgba(40,40,90,0);--sunx:50%;--suny:30%;
  --accent:#f8d878;--accent2:#e8b24a;--text:#fff7df;
  --stars:1;--starblur:0px;--moon:1;
  --glass:inset 0 1px .5px #ffffff45,inset 0 -2px 5px #00000017,0 3px 8px #0000001f;
  position:relative;width:325px;height:530px;border-radius:28px;padding:15px;
  background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3));
  box-shadow:0 18px 50px #0008;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  color:var(--text);overflow:hidden}
/* register the sky/light custom props as typed so applyTheme()'s per-second writes INTERPOLATE
   instead of snapping — continuous time/weather colour transitions for free (Baseline 2024). */
@property --g1{syntax:"<color>";inherits:true;initial-value:#0b1430}
@property --g2{syntax:"<color>";inherits:true;initial-value:#070a1c}
@property --g3{syntax:"<color>";inherits:true;initial-value:#0d1024}
@property --accent{syntax:"<color>";inherits:true;initial-value:#f8d878}
@property --accent2{syntax:"<color>";inherits:true;initial-value:#e8b24a}
@property --text{syntax:"<color>";inherits:true;initial-value:#fff7df}
@property --glow{syntax:"<color>";inherits:true;initial-value:rgba(70,90,180,0)}
@property --horizon{syntax:"<color>";inherits:true;initial-value:rgba(40,40,90,0)}
@property --sunx{syntax:"<length-percentage>";inherits:true;initial-value:50%}
@property --suny{syntax:"<length-percentage>";inherits:true;initial-value:30%}
@property --sunvx{syntax:"<length-percentage>";inherits:true;initial-value:5%}
@property --sunvy{syntax:"<length-percentage>";inherits:true;initial-value:7%}
@media (prefers-reduced-motion:no-preference){
  .c{transition:--g1 1.1s linear,--g2 1.1s linear,--g3 1.1s linear,--accent 1.1s linear,--accent2 1.1s linear,--text 1.1s linear,--glow 1.1s linear,--horizon 1.1s linear,--sunx 1.1s linear,--suny 1.1s linear,--sunvx 1.1s linear,--sunvy 1.1s linear}
}

/* atmosphere: additive (screen) light driven by the sun's trajectory — a Mie
   forward-scatter bloom at the sun, and a Rayleigh horizon band that pools under
   the sun's azimuth (left at dawn, right at dusk). No discrete "rays": clear-sky
   scattering is smooth; shafts only read through cloud (see .godray). */
.atmo{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:28px;mix-blend-mode:screen}
/* Full-card coordinates keep obstruction registered to the same cloud pixels
   used by the sky/Moon join. The mask contributes transmission, never a second
   cloud colour. Body diameter and corona extent remain independent. */
.sun-cloud-mask{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  -webkit-mask-image:var(--native-sun-cloud-mask,none);mask-image:var(--native-sun-cloud-mask,none);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;mask-mode:alpha}
.atmo .sun{position:absolute;left:var(--sunvx,5%);top:var(--sunvy,7%);width:360px;height:360px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--glow),transparent 64%);filter:blur(6px)}
/* CORNER SUN — a large, top-left-clipped daytime sun: a bright nucleus, a soft warm corona that slowly
   BREATHES (scale driven by simTime via --sunpulse, not a CSS loop), and faint radiating rays. Colour, size
   and height read the time of day — warm + low + broad corona at sunrise/sunset, white-hot + high + tight at
   noon — and weather mutes/cools it (--sunamt→0 at night). Anchored at the corner so most of the disc is
   clipped off-card, which keeps the header readable. All children screen-blend (parent .atmo). */
.atmo .suncorner{position:absolute;left:0;top:0;width:0;height:0;opacity:var(--sunamt,0);
  transform:translate(var(--sunx2,24px),var(--sunlift,14px));transition:opacity 1.5s ease,transform 2.4s ease}
.atmo .suncorner>div{position:absolute;left:0;top:0;border-radius:50%;will-change:transform;transition:background 1.6s linear}
.atmo .suncorner .disc,.atmo .sunbody .disc{width:240px;height:240px;
  transition:background 1.6s linear,opacity 1.5s ease;
  background:var(--sunprofile,radial-gradient(circle closest-side,var(--suncore,#fff6e0) 0%,var(--suncore,#fff6e0) 60%,var(--sunmid,#ffe1b4) 96%,transparent 100%));
  filter:blur(0.8px);transform:translate(-50%,-50%) scale(var(--sundisc,1)) scaleY(var(--sunflat,1))}   /* Broad radiometric nucleus and modest limb falloff within the declared body radius; scaleY is the retained low-sun refraction presentation. Corona has its own independent extent. */
.atmo .suncorner .corona{width:600px;height:600px;
  background:radial-gradient(circle,rgba(255,214,158,.4) 0%,rgba(255,198,128,.2) 24%,rgba(255,184,112,.075) 48%,rgba(255,170,100,0) 66%);
  filter:blur(10px);transform:translate(-50%,-50%) scale(var(--sunpulse,1))}   /* broad subordinate corona/radiance */
.atmo .suncorner .rays{width:850px;height:850px;opacity:var(--sunray,.32);
  background:repeating-conic-gradient(from 6deg,rgba(255,238,200,0) 0deg,rgba(255,238,200,.12) 3deg,rgba(255,238,200,0) 7.5deg,rgba(255,238,200,0) 17deg);
  -webkit-mask-image:radial-gradient(circle,#000 5%,rgba(0,0,0,.5) 26%,transparent 58%);
          mask-image:radial-gradient(circle,#000 5%,rgba(0,0,0,.5) 26%,transparent 58%);
  filter:blur(3px);transform:translate(-50%,-50%) scale(var(--sunpulse,1))}
.atmo .scatter{position:absolute;inset:0;background:radial-gradient(150% 96% at var(--sunx) 127%,var(--horizon),transparent 62%)}
.atmo .belt{position:absolute;inset:0;background:radial-gradient(135% 26% at var(--antix,50%) 120%,var(--belt,transparent),transparent 72%)}  /* Belt of Venus (anti-solar pink, civil twilight) */
.atmo .airglow{position:absolute;inset:0;background:radial-gradient(150% 40% at 50% 119%,var(--airglow,transparent),transparent 74%)}  /* night airglow + light-pollution dome low on the horizon */
/* DAWN — NEITHER false nor true dawn is a painted overlay (fail-closed). TRUE dawn IS the real physical twilight
   sky (the skyLum astronomical→nautical→civil progression + the warm horizon scatter at the sun's azimuth) plus the
   Fajr marker/time on the arc. FALSE dawn (al-fajr al-kādhib / zodiacal light) is NOT rendered: a generic CSS cone
   read as a decorative lens-flare slash and showed under a bright moon, so it was removed. A faithful zodiacal-light
   cue is FUTURE WORK only — it would require true ecliptic-tilt projection, strict dark-sky + low/no-moon + low
   light-pollution + clear-sky gating, very faint opacity, no foreground-crossing streak, and must never imply Fajr.
   See DESIGN.md › "False dawn vs true dawn". */
/* ICE-CRYSTAL SOLAR OPTICS (only with thin CIRRUS / cold air — gated in atmosphere(), never random). Centre on the
   sun's screen position (--sunx/--suny), screen-blend. 22° HALO: a discrete ring, RED inner edge → BLUE outer, with
   a DARK inner gap (refraction, opposite a rainbow). SUNDOGS/parhelia: two bright spots at the halo radius LEFT and
   RIGHT of the sun at the SAME elevation + a faint horizontal parhelic-circle band. SUN PILLAR: a soft VERTICAL
   column above/below a LOW sun (plate-crystal reflection, not a beam). */
.atmo .sunhalo{position:absolute;left:var(--sunvx,5%);top:var(--sunvy,7%);width:300px;height:300px;transform:translate(-50%,-50%);
  opacity:var(--sunhalo,0);mix-blend-mode:screen;filter:blur(1.4px);transition:opacity 2s;
  background:radial-gradient(circle,transparent 0,transparent 41%,rgba(255,176,138,.55) 45%,rgba(255,246,236,.34) 48.5%,rgba(188,206,255,.42) 53%,transparent 60%)}
.atmo .sundogs{position:absolute;left:var(--sunvx,5%);top:var(--sunvy,7%);width:300px;height:64px;transform:translate(-50%,-50%);
  opacity:var(--sundogs,0);mix-blend-mode:screen;filter:blur(2px);transition:opacity 2s;
  background:radial-gradient(ellipse 24px 44px at 5% 50%,rgba(255,206,156,.85),rgba(255,248,238,.32) 26%,transparent 50%),radial-gradient(ellipse 24px 44px at 95% 50%,rgba(255,206,156,.85),rgba(255,248,238,.32) 26%,transparent 50%),linear-gradient(90deg,transparent,rgba(238,242,255,.16) 22%,rgba(238,242,255,.16) 78%,transparent);
  background-size:100% 100%,100% 100%,100% 4px;
  background-position:center;
  background-repeat:no-repeat}
.atmo .sunpillar{position:absolute;left:var(--sunvx,5%);top:var(--sunvy,7%);width:24px;height:250px;transform:translate(-50%,-50%);
  opacity:var(--sunpillar,0);mix-blend-mode:screen;filter:blur(4px);transition:opacity 1.6s;
  background:linear-gradient(180deg,transparent 2%,var(--pillarcol,rgba(255,206,150,.55)) 32%,var(--pillarcol,rgba(255,214,160,.6)) 50%,var(--pillarcol,rgba(255,206,150,.5)) 66%,transparent 98%)}
/* ANTICREPUSCULAR rays: the same parallel shafts as crepuscular but on the side OPPOSITE the sun, converging by
   perspective toward the antisolar point (--antix, at/below the far horizon); fainter than crepuscular. */
.atmo .anticrep{position:absolute;left:var(--antix,50%);top:122%;width:560px;height:560px;transform:translate(-50%,-50%);
  opacity:var(--anticrep,0);mix-blend-mode:screen;filter:blur(5px);transition:opacity 1.6s;
  background:repeating-conic-gradient(from 168deg,rgba(255,238,222,0) 0deg,rgba(255,238,222,.12) 2.6deg,rgba(255,238,222,0) 6.5deg,rgba(255,238,222,0) 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 6%,rgba(0,0,0,.4) 30%,transparent 60%);
          mask-image:radial-gradient(circle,#000 6%,rgba(0,0,0,.4) 30%,transparent 60%)}
/* high-latitude aurora: faint green→blue curtains in the upper sky, conditional (|lat|≳55°, deep night, clear).
   Static glow gated by --aurora (no decorative loop) — its presence/strength is the state-driven part. */
.atmo .aurora{position:absolute;left:0;right:0;top:0;height:54%;opacity:var(--aurora,0);transition:opacity 2.5s;filter:blur(4px);
  background:repeating-linear-gradient(94deg,rgba(120,255,190,0) 0 13px,rgba(120,255,190,.05) 16px,rgba(120,255,190,0) 30px),
            linear-gradient(180deg,rgba(70,230,170,.17) 0,rgba(90,180,255,.10) 40%,transparent 74%);
  -webkit-mask-image:linear-gradient(180deg,transparent 4%,#000 30%,#000 55%,transparent 92%);
          mask-image:linear-gradient(180deg,transparent 4%,#000 30%,#000 55%,transparent 92%)}
/* filmic grain / atmospheric noise — kills gradient banding, adds texture */
.grain{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:var(--grain,.5);mix-blend-mode:soft-light;transition:opacity 1.4s}
/* heat/cold climate cues — soft-light tints + a frost vignette, all behind the foreground (z-index 0)
   so only the SKY is tinted, never the prayer panel/text. Driven by --warm/--cool/--frost from the
   apparent-temperature (feels-like) weather driver. */
.climate{position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:28px;overflow:hidden}
.climate>div{position:absolute;inset:0;transition:opacity 1.6s ease}
.climate .tintw{background:#ff9a3c;mix-blend-mode:soft-light;opacity:var(--warm,0)}
.climate .tintc{background:#7fb0ff;mix-blend-mode:soft-light;opacity:var(--cool,0)}
.climate .frost{background:radial-gradient(125% 95% at 50% 46%,transparent 50%,#cfe6ff 128%);mix-blend-mode:screen;opacity:var(--frost,0)}
/* heat band: a warm low-sky tint whose strength scales with apparent temperature (--heat). No decorative
   bobbing loop — it's a static, state-driven tint (a real refractive shimmer would need a per-frame filter). */
.climate .heatwave{top:auto;height:42%;background:linear-gradient(0deg,rgba(255,206,150,calc(.13*var(--heat,0))),transparent 85%);mix-blend-mode:soft-light}
/* top metadata scrim — protects the location/weather header from dissolving into the cloud
   texture; only revealed in busy weather, so clear skies stay clean (no darkening). */
.scrim{position:absolute;top:0;left:0;right:0;height:64px;z-index:1;pointer-events:none;opacity:0;transition:opacity .9s;
  background:linear-gradient(180deg,rgba(8,11,20,.5),rgba(8,11,20,.2) 52%,transparent)}
.c[data-fx=cloud] .scrim,.c[data-fx=overcast] .scrim,.c[data-fx=fog] .scrim,.c[data-fx=drizzle] .scrim,.c[data-fx=rain] .scrim,.c[data-fx=thunder] .scrim,.c[data-fx=snow] .scrim{opacity:1}

/* sky background: stars + moon */
.sky{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.stars{opacity:var(--stars);filter:blur(var(--starblur));transition:opacity .8s,filter .8s}
/* per-star twinkle subtracts its own --amp from its own base opacity --o (set inline by buildStars),
   so each star scintillates independently at its own phase/rate instead of in lockstep */
@keyframes tw{0%,100%{opacity:var(--o,.85)}50%{opacity:calc(var(--o,.85) - var(--amp,.18)*var(--star-turb,1))}}
/* rare BRIGHT anchor stars: a soft halo (so the field reads as a few luminaries over a faint dust bed, not a
   uniform wallpaper) + a 4-ray diffraction glint that tracks them (positioned in projectStars). */
.stars circle.br{filter:drop-shadow(0 0 2.6px var(--hc,#e4eeff)) drop-shadow(0 0 7px var(--hc,#c2d2ff))}   /* soft COLOURED halo in the luminary's own hue */
.starglints{opacity:var(--stars);filter:blur(var(--starblur))}
.starglints g{mix-blend-mode:screen}
.starglints line{stroke:#f2f6ff;stroke-width:.7;stroke-linecap:round;filter:blur(.3px)}
/* reduced-motion: stop ALL atmospheric/weather motion — including the thunder flash (photosensitivity). Scoped to
   .c:not(.motionfull) so an explicit &motion=full override re-enables animation even under OS reduced-motion
   (an honest opt-in; the DEFAULT still respects the accessibility preference). The JS rAF cloud/sun-breath paths
   are gated by isMotionReduced() — the single JS source consulted by both paint() and the loop — which reads this
   SAME native @media signal and honours MOTIONFULL. (CSS @media kept as-is: it is the live native signal, not
   driftable logic; the duplicated JS matchMedia checks were the real drift surface and are now unified.) */
@media (prefers-reduced-motion:reduce){
  .c:not(.motionfull) .stars circle,.c:not(.motionfull) .starglints g,.c:not(.motionfull) .wfx .fog,.c:not(.motionfull) .wfx .drop,.c:not(.motionfull) .wfx .flake,.c:not(.motionfull) .wfx .flash,.c:not(.motionfull) .wfx .bolt,
  .c:not(.motionfull) .climate .heatwave,.c:not(.motionfull) .atmo .sun,.c:not(.motionfull) .atmo .scatter,.c:not(.motionfull) .milkyway{animation:none!important}
}
/* bright-anchor 4-ray glints SCINTILLATE: each pulses around its projected base opacity (--go) at its own phase/
   rate, so the luminaries the eye tracks visibly glint instead of sitting static. */
@keyframes glintpulse{0%,100%{opacity:var(--go,.6)}45%{opacity:calc(var(--go,.6)*0.3)}}
/* battery: a 24/7 iframe must not repaint when the user can't see it. Paused when the tab is hidden
   OR the widget is scrolled offscreen (set by an IntersectionObserver + visibilitychange in JS). */
.c.paused *,.c.paused{animation-play-state:paused!important}
/* A pending target has no visible celestial/weather defaults. Prayer and settings stay usable.
   The accepted first paint resolves real styles under this local transition suppression. */
.c.sky-pending{background:#101725}
.c.sky-pending .sky,.c.sky-pending .atmo,.c.sky-pending .wfx,.c.sky-pending .climate,.c.sky-pending .grain,.c.sky-pending .scrim{visibility:hidden}
.c.sky-initializing,.c.sky-initializing .sky *,.c.sky-initializing .atmo *,.c.sky-initializing .wfx *,.c.sky-initializing .climate *,.c.sky-initializing .scrim{transition:none!important}
.c:not(.moon-ready) .moon{visibility:hidden}
.milkyway{opacity:var(--mw,0);transform-box:fill-box;transform-origin:center;transform:rotate(var(--mwtilt,0deg));transition:opacity 1.6s ease,transform 4s linear}
.moon{opacity:var(--moongrp,1);transition:opacity 1.2s,transform 1.6s linear}   /* --moongrp = lunar-CALENDAR presence: kept >0 every night (subtle ashen "calendar moon" even near-new / below horizon) so the slot is never empty; physical moonlight is a SEPARATE var (--moonbeam). transform eases so the moon GLIDES along its path */
.moon-mask-geometry{transition:transform 1.6s linear}
/* Filtered stars/glints/dust are cut out independently of the moon group's twilight fade.
   Keep the binary cutout through that existing 1.2s withdrawal; fast mode snaps both. */
.moon-mask-disc{opacity:0;transition:opacity 0s linear 1.2s}
.moon-mask-disc.mask-on{opacity:1;transition-delay:0s}
.mbeam{fill:#cdd9f5;filter:blur(26px);mix-blend-mode:screen;opacity:var(--moonbeam,0);transition:opacity 1.4s}  /* directional moonlight: present only for a real above-horizon moon */
/* debug fast-forward: a small simulated-clock read-out, only shown when ?timeScale= is set */
.simclock{position:absolute;left:8px;top:6px;z-index:6;display:none;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff;background:rgba(8,11,20,.55);padding:2px 7px;border-radius:7px;letter-spacing:.02em;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dbglayers{position:absolute;right:6px;bottom:6px;z-index:6;display:none;white-space:pre;font:9px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe0ff;background:rgba(8,11,20,.62);padding:4px 7px;border-radius:7px;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dbgmoon{position:absolute;left:6px;bottom:6px;z-index:6;display:none;max-width:calc(100% - 12px);box-sizing:border-box;white-space:pre-wrap;font:9px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#ffe0c0;background:rgba(8,11,20,.62);padding:4px 7px;border-radius:7px;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dbgmotion{position:absolute;left:8px;top:22px;z-index:7;display:none;white-space:pre;font:9px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#bdf3d0;background:rgba(8,11,20,.66);padding:4px 7px;border-radius:7px;pointer-events:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.c.fast,.c.fast *{transition:none!important}   /* fast-forward: snap every layer (sky, moon position/opacity, clouds) each frame — dense frames read smooth, no lagging/lurching/see-through mid-transition */
.moccluder{fill:var(--moon-sky,#0b1430);opacity:var(--moonocc,1);transition:opacity .9s}  /* opaque only when stars are out (hides them); 0 in daylight so no ghost moon by day */
.mfeatures{opacity:var(--moonfeat,1);transition:opacity .9s}
/* 22° ice halo (refraction ring) and water-droplet corona (diffraction aureole) — two DISTINCT optical elements,
   each gated by cloud type / humidity in paint(); never both prominent at once. */
.mhalo{fill:url(#mhalog);mix-blend-mode:screen;filter:blur(2.5px);opacity:var(--mhalo,0);transition:opacity 1.8s}
.mparhelia{mix-blend-mode:screen;filter:blur(1.6px);opacity:var(--mparhelia,0);transition:opacity 1.8s}   /* lunar moondogs */
.mcorona{fill:url(#mcoronag);mix-blend-mode:screen;filter:blur(3px);opacity:var(--mcorona,0);transition:opacity 1.4s}
.mglow{fill:url(#mglowg);filter:blur(2px);mix-blend-mode:screen;opacity:calc(var(--mgo,0) * var(--mrad,1))}   /* physical atmospheric glow: fail closed before paint; breathing via --mrad */

/* weather effects: animated overlay, behind the foreground (z-index 1) */
.wfx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;border-radius:28px}
.wfx .veil{position:absolute;inset:0;opacity:0;transition:opacity .9s;
  background:linear-gradient(180deg,#262e3600,#222831 96%)}
/* CLOUD DECKS render to a small <canvas> (the JS CLOUD ENGINE paints an evolving 3D-noise density field).
   CSS upscales the tiny buffer and blurs it — the blur both smooths the upscale and softens the cloud edges.
   A gentle vertical mask keeps the very top (header) and very bottom (grid) clear; the density field's own
   band weighting concentrates cloud around the horizon. Coverage/advection/evolution all live in JS. */
.wfx .cloudcanvas{position:absolute;inset:0;width:100%;height:100%;filter:blur(.55px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 3%,#000 24%,transparent 34%);
          mask-image:linear-gradient(180deg,transparent 0,#000 3%,#000 24%,transparent 34%)}
/* The single radiometric body shares the atmospheric light group. A normal
   foreground group would replace path radiance with orange surface colour.
   Geometry is unchanged; corona/rays/optics remain separate contributions. */
.atmo .sunbody{position:absolute;left:0;top:0;width:0;height:0;opacity:var(--sunbodyamt,var(--sunamt,0));
  transform:translate(var(--sunx2,24px),var(--sunlift,14px));transition:opacity 1.5s ease,transform 2.4s ease}
.atmo .sunbody .disc{position:absolute;left:0;top:0;border-radius:50%;opacity:1;mix-blend-mode:screen}
/* One body owner through the horizon transition. The retained corner group
   supplies corona/rays only; overlapping copies must not change core energy. */
.atmo .suncorner .disc{opacity:0}
.wfx .sunhaze{position:absolute;left:var(--sunvx,5%);top:var(--sunvy,7%);width:300px;height:300px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--glow),transparent 56%);mix-blend-mode:screen;filter:blur(7px);opacity:0;transition:opacity 1s}
/* CREPUSCULAR RAYS (light shafts): soft radial shafts emanating from the sun's screen position, revealed
   only by --ray (sun up + broken cloud + participating haze; 0 in clear-dry or solid-overcast sky). Behind
   the arc/text. The shafts come from the conic gradient; the radial mask fades them out from the source. */
.wfx .godray{position:absolute;left:var(--sunvx,5%);top:var(--sunvy,7%);width:560px;height:560px;transform:translate(-50%,-50%);pointer-events:none;
  background:repeating-conic-gradient(from 8deg,rgba(255,247,228,0) 0deg,rgba(255,247,228,.16) 2.4deg,rgba(255,247,228,0) 6.5deg,rgba(255,247,228,0) 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 4%,rgba(0,0,0,.42) 26%,transparent 62%);
          mask-image:radial-gradient(circle,#000 4%,rgba(0,0,0,.42) 26%,transparent 62%);
  mix-blend-mode:screen;filter:blur(6px);opacity:var(--ray,0);transition:opacity 1.4s}
.wfx .fog{position:absolute;left:-22%;right:-22%;height:48px;opacity:0;filter:blur(9px);transition:opacity 1s;
  background:linear-gradient(90deg,transparent,#cdd3d9b3 45%,#cdd3d966 60%,transparent);animation:fogdrift linear infinite}
/* rain ORIGINATES at the cloud deck (≈the horizon band, top:24%) and streaks down from there — not from above
   the whole card — so drops belong to the clouds overhead. Slants with the live wind via --rain-slant. */
.wfx .drop{position:absolute;top:19%;width:1.5px;height:14px;border-radius:2px;display:none;will-change:transform;
  background:linear-gradient(#b9dcf500,#b9dcf5cc);animation:fall linear infinite}
.wfx .flake{position:absolute;top:-6%;border-radius:50%;display:none;background:#eef4ff;box-shadow:0 0 3px #dfeaffaa;will-change:transform;animation:snowfall linear infinite}
.wfx .flash{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(115% 60% at 60% 9%,#eaecffe6,#c2b6ff77 26%,#9aa0ff22 44%,transparent 60%)}  /* localized on the upper cloud DECK, not the whole screen */
.wfx .bolt{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.wfx .bolt path{fill:none;stroke:#f6f8ff;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;
  filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 5px #b6c2ff) drop-shadow(0 0 13px #6f8cff)}   /* bright electric core + layered blue glow */
/* fog is transported monotonically by the wind too (one direction, linear), not swept back and forth */
@keyframes fogdrift{from{transform:translateX(calc(var(--wind-dir,1)*-12%))}to{transform:translateX(calc(var(--wind-dir,1)*14%))}}
/* precipitation slants with the live wind (--rain-slant / --snow-slant, px of horizontal drift over the
   fall). Base = 0 (vertical) in calm air; snow slants ~2.5× rain for the same wind (far lower fall speed). */
/* rain falls from the cloud deck and FADES OUT in the lower sky (≈the horizon band), so streaks belong to the
   clouds overhead and never rain over the opaque prayer list below. */
@keyframes fall{0%{transform:translate(0,-10px);opacity:0}22%{opacity:var(--rain-op,.75)}60%{opacity:var(--rain-op,.75)}100%{transform:translate(var(--rain-slant,0px),132px);opacity:0}}
@keyframes snowfall{0%{transform:translate(0,-14px);opacity:0}10%{opacity:.95}25%{transform:translate(calc(var(--snow-slant,0px)*.22 + 8px),128px)}50%{transform:translate(calc(var(--snow-slant,0px)*.5 - 6px),280px)}75%{transform:translate(calc(var(--snow-slant,0px)*.78 + 8px),420px)}90%{opacity:.95}100%{transform:translate(var(--snow-slant,0px),560px);opacity:0}}
/* lightning: an irregular multi-strike pattern (not a fixed metronome). Three strikes at non-uniform offsets
   over a long period; flash + bolt run at different (coprime-ish) periods so the combined cadence doesn't
   obviously repeat across a 15–60s watch. Deterministic, reduced-motion-gated. */
/* a faint PERSISTENT storm-glow baseline (.07) so the thunderstorm reads at a glance between strikes, plus the
   bright irregular strikes with a slightly longer residual tail. */
@keyframes flash{0%,100%{opacity:.07}2%{opacity:.88}3.2%{opacity:.18}4%{opacity:.62}6.5%{opacity:.12}9%{opacity:.07}
  37%{opacity:.07}38%{opacity:.78}39.3%{opacity:.16}40.6%{opacity:.56}43.5%{opacity:.1}46%{opacity:.07}
  72%{opacity:.07}73%{opacity:.94}74.4%{opacity:.24}76.5%{opacity:.1}79%{opacity:.07}}
/* reveal per condition */
/* cloud-deck coverage is data-driven (cloudState.covLow/Mid/High in JS → canvas density field), not CSS vars. */
.c[data-fx=cloud]   .sunhaze{opacity:.45}
.c[data-fx=drizzle] .sunhaze{opacity:.22}
.c[data-fx=cloud]    .veil{opacity:.3}
.c[data-fx=overcast] .veil{opacity:.72}
.c[data-fx=drizzle]  .veil{opacity:.46}
.c[data-fx=rain]     .veil{opacity:.62}
.c[data-fx=thunder]  .veil{opacity:.74}
.c[data-fx=fog]      .veil{opacity:.5}
.c[data-fx=snow]     .veil{opacity:.34}
.c[data-fx=fog]      .fog{opacity:.62}
.c[data-precip=on][data-fx=rain] .drop,.c[data-precip=on][data-fx=thunder] .drop{display:block}
.c[data-precip=on][data-fx=drizzle] .drop:nth-child(3n+1){display:block;opacity:.6;animation-duration:.85s}
.c[data-fx=thunder]  .drop{animation-duration:.4s}
.c[data-precip=on][data-fx=snow] .flake{display:block}
.c[data-fx=thunder][data-lightning=on] .flash{animation:flash 19s linear infinite}
.c[data-fx=thunder][data-lightning=on] .bolt{animation:flash 23s linear infinite -4s}

/* header — LIQUID-GLASS BELT (corrected geometry): NOT one full-width pill. Two CONTENT-FIT frosted straps
   (location-left, temperature-right), each sized to its text + symmetric VISIBLE padding, flanking a circular
   icon BUCKLE (~25px) that sits ABOVE them (z-index) and CUTS the belt — the strap tucks 7px UNDER the buckle
   (negative margin) and the buckle covers it, so no strap shows behind the buckle. Straps are THINNER (18px) than
   the buckle. Inner padding = outer + tuck, so the gap buckle→text equals the gap text→strap-end. Subtle inner
   glass only — NO heavy drop shadow (matches the prayer cells). .h has a FIXED height so layout/footer never move. */
.h{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  --buckle-r:12.5px;--belt-tuck:7px;--belt-cut-center:5.5px;--belt-cut-r:14px;   /* belt-cut-center = buckle-r − belt-tuck (the buckle centre relative to each strap's inner edge) */
  height:25px;box-sizing:border-box;margin:0 0 12px;padding:0;background:none;border:none;box-shadow:none}
.e,.wt{box-sizing:border-box;height:18px;max-width:128px;display:flex;align-items:center;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(44,52,76,.18) 52%,rgba(10,16,30,.26));  /* a top sheen fading to a DARK-tinted base, so the strap reads over BRIGHT skies too (not just night) */
  -webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2);
  border:1px solid rgba(255,255,255,.17);box-shadow:inset 0 1px .5px rgba(255,255,255,.36)}
/* the inner end of each strap is physically CUT by a circular mask matching the buckle, so the buckle sits over
   sky/glass — NOT over translucent strap pixels (z-index alone can't fix it: backdrop-filtered glass reveals what's
   underneath). Left strap cut at its RIGHT edge, right strap at its LEFT edge. */
.e{justify-self:end;grid-column:1;padding:0 18px 0 15px;margin-right:calc(-1 * var(--belt-tuck));border-radius:9px 3px 3px 9px;
  -webkit-mask-image:radial-gradient(circle var(--belt-cut-r) at calc(100% + var(--belt-cut-center)) 50%,transparent 0 13.5px,#000 14px);
          mask-image:radial-gradient(circle var(--belt-cut-r) at calc(100% + var(--belt-cut-center)) 50%,transparent 0 13.5px,#000 14px);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 30%,#fff)}
.wt{justify-self:start;grid-column:3;padding:0 15px 0 18px;margin-left:calc(-1 * var(--belt-tuck));border-radius:3px 9px 9px 3px;
  -webkit-mask-image:radial-gradient(circle var(--belt-cut-r) at calc(0% - var(--belt-cut-center)) 50%,transparent 0 13.5px,#000 14px);
          mask-image:radial-gradient(circle var(--belt-cut-r) at calc(0% - var(--belt-cut-center)) 50%,transparent 0 13.5px,#000 14px);
  font-size:12px;font-weight:600;color:var(--text);opacity:.96}
/* BUCKLE — ~25px, ABOVE the straps (z-index 3) and now over a CUT-OUT gap; isolate+overflow so its glass composites
   over sky, not over belt geometry. Subtle inner glass, no heavy drop shadow. */
.buckle{position:relative;z-index:3;justify-self:center;grid-column:2;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;isolation:isolate;overflow:hidden;
  background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.37),rgba(150,170,210,.13) 60%,rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.37);
  box-shadow:inset 0 1px 1.2px rgba(255,255,255,.62),inset 0 -1.5px 2.5px rgba(8,12,24,.24)}
.wi{position:relative;z-index:2;font-size:13px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.34))}
/* settings affordance: in LOCAL mode the buckle becomes a button; the weather emoji morphs to a
   gear on hover/focus (hover NOT required — tap/Enter/Space also open). Hardcoded embeds never get
   .interactive, so their buckle is the plain decorative weather icon, visually unchanged. */
.buckle.interactive{cursor:pointer}
.buckle.interactive .wi{transition:opacity .18s ease}
.buckle .gear{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:13px;line-height:1;opacity:0;pointer-events:none;color:var(--text);filter:drop-shadow(0 1px 1px rgba(0,0,0,.34));transition:opacity .18s ease}
.buckle.interactive:hover .wi,.buckle.interactive:focus-visible .wi{opacity:0}
.buckle.interactive:hover .gear,.buckle.interactive:focus-visible .gear{opacity:1}
.buckle.persist-warning .wi{opacity:0}
.buckle.persist-warning .gear{opacity:1;color:#ffc08a}
.set-live-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.buckle:focus{outline:none}
.buckle.interactive:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* in-card SETTINGS panel — overlays the prayer display within the same 325×530 card; internal
   scroll (the iframe stays scrolling="no"); never resizes the iframe or clips header/footer. */
.settings{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;border-radius:inherit;
  background:linear-gradient(180deg,rgba(10,16,30,.94),rgba(6,10,20,.965));
  -webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);
  color:#fff7df;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left}
.c.settings-open .settings{display:flex}
.set-hd{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:11px 13px 6px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.set-x{border:0;background:none;color:#fff7df;font-size:20px;line-height:1;cursor:pointer;width:30px;height:30px;padding:0;display:grid;place-items:center;border-radius:8px;opacity:.82}
.set-x:hover{opacity:1}
.set-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 13px 8px;display:flex;flex-direction:column;gap:4px}
.set-l{display:block;font-size:9.5px;letter-spacing:.035em;text-transform:uppercase;color:#f6d98bcc;margin:6px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-i{width:100%;min-height:33px;padding:6px 9px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(8,14,24,.72);color:#fff7df;font:inherit;font-size:13px}
.set-i:focus-visible,.set-b:focus-visible,.set-x:focus-visible,.set-icon:focus-visible,.set-pin:focus-visible{outline:2px solid var(--accent,#f8d878);outline-offset:1px}
/* location row: search/name input + a single map-pin button on the right (replaces the two text buttons).
   The pin is a tri-state location indicator: RED-lit = estimated from IP (default), GLOWING = precise GPS
   active, GREY = manual (not sensing). Clicking it requests precise location. */
.set-locrow{display:flex;gap:8px;align-items:stretch}
.set-locrow .set-i{flex:1 1 auto;min-width:0}
.set-pin{flex:0 0 auto;width:44px;min-height:40px;display:grid;place-items:center;cursor:pointer;border-radius:9px;
  border:1px solid rgba(255,255,255,.18);background:rgba(8,14,24,.72);color:#9aa3b2;transition:color .2s ease,border-color .2s ease}
.set-pin svg{width:20px;height:24px;display:block}
.set-pin svg path{fill:currentColor;stroke:none}
.set-pin.lit{color:#ec4a3d;border-color:#ec4a3d55}                                   /* IP-estimated (default ON) — filled red pin */
.set-pin.glow{color:#ff5347;border-color:#ff534788}                                  /* precise GPS — filled + glow */
.set-pin.glow svg{filter:drop-shadow(0 0 3px #ff5347) drop-shadow(0 0 6px rgba(255,83,71,.55))}
.set-pin.off{color:#9aa3b2}                                                          /* manual — OUTLINE pin (distinct SHAPE, not colour-only) */
.set-pin.off svg path{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
@media (forced-colors:active){ .set-pin svg path{fill:currentColor} .set-pin.off svg path{fill:none;stroke:currentColor} }
/* header buttons: reset (counter-clockwise) icon + the × close — equal-sized boxes, centred glyphs */
.set-hd-btns{display:flex;align-items:center;gap:6px}
.set-icon{border:0;background:none;color:#fff7df;cursor:pointer;width:30px;height:30px;padding:0;border-radius:8px;display:grid;place-items:center;opacity:.82}
.set-icon:hover{opacity:1}
.set-icon svg{width:18px;height:18px;display:block}
.set-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.set-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.set-units{flex:0 0 auto;width:62px;padding:6px 6px}
.set-status{font-size:11px;line-height:1.35;color:#9be29b;min-height:14px;margin-top:5px;white-space:pre-line}
.set-status.err{color:#ffc08a}
.set-footer{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:36px;padding:9px 15px;border-top:1px solid rgba(255,255,255,.1)}
.set-link{display:grid;place-items:center;color:#5f6a7d;padding:5px;border-radius:8px;transition:color .25s ease,transform .15s ease}   /* monotone by default; fills with colour on hover */
.set-link svg{width:21px;height:21px;display:block;fill:currentColor;filter:drop-shadow(0 1px 0.5px rgba(255,255,255,.14))}            /* faint engraved/indent look */
.set-link:hover,.set-link:focus-visible{transform:translateY(-1px)}
.set-link.heart:hover,.set-link.heart:focus-visible{color:#ff4d6d}                   /* heart fills red */
.set-link:not(.heart):hover,.set-link:not(.heart):focus-visible{color:#ffffff}        /* GitHub fills white */
.set-link:focus-visible{outline:2px solid var(--accent,#f8d878);outline-offset:2px}

/* prayer panel */
.panel{position:relative;z-index:1}
.arc{display:block;width:100%;height:180px;margin:0;overflow:visible}
.foc{position:absolute;left:0;right:0;top:57.5px;text-align:center}
.foc .cn{position:relative;top:4px;font-family:var(--font-display);font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.015em;color:var(--text);opacity:.95;margin-bottom:30.6px}
.foc .nt{position:relative;top:4.4px;font-family:var(--font-display);font-size:46px;line-height:1;font-weight:600;letter-spacing:.005em;color:var(--accent)}
.arc .horizon{stroke:#ffffff;stroke-opacity:.16;stroke-width:1;stroke-dasharray:2.5 5}
/* layered arc for legibility over cloud/rain without going thick or cartoonish:
   railsh = a soft dark shadow under the WHOLE arc (separation); rail = the secondary base/future
   arc; warmsh = a faint dark shadow under the ACTIVE stroke (weather-gated); warm = the active
   accent body with its existing glow (unchanged); warmcore = a thin crisp accent core on top. */
.arc .railsh{fill:none;stroke:#070b16;stroke-opacity:.26;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:blur(1.6px)}
.arc .rail{fill:none;stroke:#ffffff;stroke-opacity:.3;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.arc .warmsh{fill:none;stroke:#05070f;stroke-opacity:0;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;filter:blur(2px)}
.arc .warm{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--accent))}
.arc .warmcore{fill:none;stroke:color-mix(in srgb,var(--accent) 78%,#fff);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arc .dot{fill:#ffffff;fill-opacity:.72}
.arc .dot.next{fill:var(--accent)}
/* high-latitude: Fajr/Isha that are method-ESTIMATED (sun never reaches the depression angle) read as a
   hollow ring, not a solid crossing dot — honest about the adjustment. */
.arc .dot.adj{fill-opacity:.12;stroke:#fff;stroke-opacity:.6;stroke-width:1.1;stroke-dasharray:1.6 1.6}
.arc .dot.adj.next{stroke:var(--accent);stroke-opacity:.85}
/* Sunrise is an astronomical event, not a prayer → a clean hollow RING (solid, distinct from the dashed "estimated" style) */
.arc .dot.ring{fill-opacity:0;stroke:#fff;stroke-opacity:.6;stroke-width:1.3}
.arc .dot.ring.next{stroke:var(--accent);stroke-opacity:.92}
.arc .cur{fill:none;stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}
/* bar mirrors the arc's light system: a dark inset track, then the active fill as a soft accent
   glow (box-shadow, same --accent as the arc) under a crisp gradient on top. No overflow:hidden so
   the glow can breathe and the fill keeps a rounded luminous tip. */
.bar{position:relative;height:6px;border-radius:6px;background:#ffffff12;margin-top:16px;box-shadow:inset 0 1px 2px rgba(0,0,0,.42)}
.bar>i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 5px color-mix(in srgb,var(--accent) 58%,transparent);transition:width .9s linear}
/* busy weather: deepen the dark separation and lift the accent glow a touch — elegant, not neon. */
.c[data-fx=cloud] .arc .railsh,.c[data-fx=overcast] .arc .railsh,.c[data-fx=fog] .arc .railsh,.c[data-fx=drizzle] .arc .railsh,.c[data-fx=rain] .arc .railsh,.c[data-fx=thunder] .arc .railsh,.c[data-fx=snow] .arc .railsh{stroke-opacity:.58}
.c[data-fx=cloud] .arc .warmsh,.c[data-fx=overcast] .arc .warmsh,.c[data-fx=fog] .arc .warmsh,.c[data-fx=drizzle] .arc .warmsh,.c[data-fx=rain] .arc .warmsh,.c[data-fx=thunder] .arc .warmsh,.c[data-fx=snow] .arc .warmsh{stroke-opacity:.5}
.c[data-fx=cloud] .bar,.c[data-fx=overcast] .bar,.c[data-fx=fog] .bar,.c[data-fx=drizzle] .bar,.c[data-fx=rain] .bar,.c[data-fx=thunder] .bar,.c[data-fx=snow] .bar{box-shadow:inset 0 1px 2.5px rgba(0,0,0,.6)}
.c[data-fx=cloud] .bar>i,.c[data-fx=overcast] .bar>i,.c[data-fx=fog] .bar>i,.c[data-fx=drizzle] .bar>i,.c[data-fx=rain] .bar>i,.c[data-fx=thunder] .bar>i,.c[data-fx=snow] .bar>i{box-shadow:0 0 7px color-mix(in srgb,var(--accent) 76%,transparent)}
.left{display:block;text-align:center;margin-top:3.3px;color:var(--text);font-size:17.25px;font-weight:400;line-height:1.2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* countdown line reads in three roles: the time is the value (UI-mono + tabular, the
   brightest part so it's read first); "left until" is quiet connective tissue; the prayer
   name borrows the display face AND the --accent colour so it stays tied to the hero time
   and the prayer-name system. text-shadow is inherited from .left (dark micro-rim, no glow). */
.left .until-time{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;letter-spacing:-.01em;opacity:.92}
.left .until-label{opacity:.6;font-family:var(--font-body)}   /* words stay Inter; the spaces around them inherit .left's mono so every gap is one even monospace space */
.left .until-prayer{font-family:var(--font-display);font-weight:600;font-size:20.25px;color:var(--accent)}

/* prayer-times grid */
.times{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:6px;margin-top:9.6px}
/* Liquid glass preserves the faded inactive rows, current inset and upcoming tint. */
.p{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 9px;border-radius:11px;background:linear-gradient(160deg,#ffffff26,#ffffff0d);border:1px solid #ffffff2e;-webkit-backdrop-filter:blur(7px) saturate(135%);backdrop-filter:blur(7px) saturate(135%);box-shadow:var(--glass);transition:opacity .3s,background .3s}
.p.on{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 88%,#fff),color-mix(in srgb,var(--accent) 90%,#253047));color:#211d15;border-color:var(--accent);box-shadow:var(--glass),inset 3px 0 0 var(--accent)}
/* An opaque accent plate gives NEXT a stable identity even over a warm horizon.
   CURRENT retains its independent outline; future rows remain glass, not past. */
.p.on b{font-weight:700}
.p.on b,.p.on .tm{text-shadow:none}
.c[data-appearance="contrast"] .p{opacity:1;color:#f0edf8;background:linear-gradient(160deg,#ffffff26,#ffffff0d),rgba(9,17,28,.90)}
.c[data-appearance="contrast"] .p.on{color:#211d15;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 88%,#fff),color-mix(in srgb,var(--accent) 90%,#253047))}
.p.now{box-shadow:var(--glass),inset 0 0 0 1.5px color-mix(in srgb,var(--text) 55%,transparent)}
.p.past{opacity:.42}
.p b{font-weight:600;font-size:12.5px;line-height:16.7px;letter-spacing:.01em}
.tm{font-weight:600;font-size:12.5px;line-height:16.7px}

/* dates */
.d{position:relative;z-index:1;direction:ltr;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;padding:0 10px;color:color-mix(in srgb,var(--text) 90%,transparent);font-size:11.5px;line-height:1.2}
.date-trigger{min-inline-size:0;flex:0 1 auto;display:inline-flex;padding:0;border:0;border-radius:3px;background:none;color:inherit;font:inherit;line-height:inherit;text-align:left;text-shadow:inherit;cursor:pointer}
.date-trigger:hover{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.date-trigger:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.date-value{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-unavailable{font-size:.78em;font-weight:600;color:color-mix(in srgb,#ffc27a 76%,var(--text));unicode-bidi:isolate}
.date-dialog{box-sizing:border-box;width:calc(100vw - 28px);max-width:297px;max-height:calc(100vh - 28px);margin:auto;padding:16px;border:1px solid #ffffff35;border-radius:16px;color:#f0edf8;background:rgba(9,17,28,.97);box-shadow:0 12px 32px #0006;font-family:Inter,system-ui,sans-serif;overflow-y:auto;overflow-x:hidden;text-align:left;direction:ltr}
.date-dialog::backdrop{background:rgba(3,6,12,.42)}
.date-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.date-dialog h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600}
.date-dialog button{border:1px solid #ffffff35;border-radius:8px;padding:6px 9px;background:#ffffff10;color:inherit;font:inherit;font-size:12px;cursor:pointer}
.date-dialog button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.date-dialog dl{margin:0;display:grid;gap:5px}
.date-dialog dt{font-size:11px;font-weight:600;color:#c9c5d5}
.date-dialog dd{margin:0 0 12px;font-size:14px;line-height:1.5;white-space:normal;overflow-wrap:anywhere;unicode-bidi:plaintext;user-select:text}
.date-dialog p{margin:0;font-size:12px;line-height:1.5;white-space:normal;overflow-wrap:anywhere;user-select:text}
.er{opacity:.55;font-size:.84em;margin:0 4px;letter-spacing:.05em;unicode-bidi:isolate}
#ah .er{font-size:1.3em;opacity:.66}   /* the Arabic hāʾ (AH marker) reads small — give it a few pt */
/* DAY-ROLLOVER STALE CUE: a quiet warm worded chip by the Hijri date (shown only when prayer times couldn't refresh
   for the new day) + a faint date-row desaturation. Warm/amber (informative), never red/alarming; words, not just colour. */
.staletag{font-size:.78em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,#ffc27a 76%,var(--text));unicode-bidi:isolate}
.c[data-stale="prayer"] .d{filter:saturate(.7);opacity:.88;transition:opacity .6s linear,filter .6s linear}
.mph{font-size:.92em;unicode-bidi:isolate}   /* moon-phase emoji by the AH date (own class — .moon is the sky moon) */
.mph.pre{opacity:.6}                    /* faint preview of the Hijri day that begins at tonight's Maghrib */

/* readability over busy cloud/rain midtones: a crisp dark micro-rim + soft depth (NO heavy
   outline that would muddy the serif, NO cheap white glow). Dates + glass cells keep a light shadow. */
.d{text-shadow:0 0 1px rgba(4,8,16,.85),0 1px 2px rgba(0,0,0,.55),0 2px 5px rgba(0,0,0,.3)}
.p b,.tm{text-shadow:0 1px 2px rgba(0,0,0,.28)}
.e,.wi,.wt{text-shadow:0 0 1px rgba(4,8,16,.92),0 1px 1px rgba(4,8,16,.6),0 2px 5px rgba(0,0,0,.42)}
.foc .cn,.left{text-shadow:0 0 1px rgba(6,10,18,.88),1px 0 1px rgba(6,10,18,.5),-1px 0 1px rgba(6,10,18,.5),0 1px 1px rgba(6,10,18,.6),0 3px 7px rgba(0,0,0,.4)}
/* the hero time: strongest rim + depth, plus a faint accent-tinted bloom (warm by day, cool by
   night via --accent) for atmosphere — never a white glow. */
.foc .nt{text-shadow:0 0 1px rgba(0,0,0,.95),1px 0 1px rgba(0,0,0,.6),-1px 0 1px rgba(0,0,0,.6),0 1px 1px rgba(0,0,0,.7),0 2px 3px rgba(0,0,0,.55),0 5px 13px rgba(0,0,0,.4),0 0 16px color-mix(in srgb,var(--accent) 15%,transparent)}
/* tabular figures so the per-second countdown, times and dates never jitter */
.foc .nt,.left,.tm,.d,.wt{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
</style>
</head>

      <radialGradient id="mparhg" cx="50%" cy="50%" r="50%">   <!-- moondog spot: warm-white near the moon → cool/transparent outward -->

<script src="config.js"></script>
<script>
"use strict";
// ---- config: resolved from the shared module (config.js / window.SalahConfig) ----
// `q` stays for SIM/debug-only flags below. CONFIG is the single resolved WidgetConfig;
// lat/lon/method/… are LET bindings populated from it (mutable — local mode resolves them
// at boot via saved-config / coarse auto-detect, and the in-widget settings panel updates
// them live without a reload). HARDCODED embeds (#lat&lon, no local flag) resolve
// SYNCHRONOUSLY here, byte-identical to the previous behaviour.
const q = new URLSearchParams(location.hash.slice(1));
let lat=null, lon=null, tz="America/New_York", label="", method="2", school="0",
    fmt24=true, units="f", datefmtStr="YYYY-MM-DD", LPOLL=0;
let _cacheTz="America/New_York";   // tz FROZEN into the prayer-cache key at resolve time (the old const captured the boot-time tz; the live `tz` is later overwritten by the API's meta zone, but the cache key must stay stable across reloads)
let CONFIG=null, _cfgMode="bare", _needsDetect=false, _hashCfg={}, _cfgFlags={local:false,preferLocal:false};
let _autoDetectSource=null, _autoDetectStatus="idle", _geoPermission="unknown", _geoLastError=null, _storageErr=null;
function bindConfig(c){            // copy a resolved WidgetConfig into the live runtime bindings
  if(!c) return;
  CONFIG=c;
  lat=c.lat; lon=c.lon; tz=c.tz||tz; _cacheTz=c.tz||_cacheTz; label=c.label||"";
  method=c.method; school=c.school; fmt24=(c.time!=="12"); units=c.units;
  datefmtStr=c.datefmt; LPOLL=c.lp||0;
  const card=document.querySelector(".c"); if(card) card.dataset.appearance=c.appearance==="contrast"?"contrast":"glass";
}
if(window.SalahConfig){
  const _r=SalahConfig.resolve(location.hash);
  _cfgMode=_r.mode; _needsDetect=_r.needsDetect; _hashCfg=_r.hashCfg||{}; _cfgFlags=_r.flags||_cfgFlags;
  bindConfig(_r.cfg);             // null for bare / needs-detect → lat/lon stay null, resolved later in boot()
}else{
  // DEGRADE: config.js failed to load → legacy hash-only parse so the widget still runs.
  console.warn("salah_widget: config.js missing — falling back to legacy hash parsing.");
  const _la=q.get("lat"), _lo=q.get("lon");
  _cfgMode=(_la!=null&&_lo!=null)?"hardcoded":"bare";
  if(_cfgMode==="hardcoded"){
    const _P={iso:"YYYY-MM-DD",us:"MM/DD/YYYY",eu:"DD/MM/YYYY",long:"DD MMMM YYYY"};
    lat=+_la; lon=+_lo; tz=q.get("tz")||"America/New_York"; _cacheTz=tz; label=q.get("label")||"";
    method=q.get("method")||"2"; school=q.get("school")||"0";
    fmt24=(q.get("time")||"24")!=="12"; units=(q.get("units")||"f").toLowerCase()==="c"?"c":"f";
    const _df=q.get("datefmt")||"iso"; datefmtStr=Object.prototype.hasOwnProperty.call(_P,_df.toLowerCase())?_P[_df.toLowerCase()]:_df;
    LPOLL=Math.min(1,Math.max(0,+q.get("lp")||0));
    CONFIG={v:1,lat,lon,tz,label,method,school,time:fmt24?"24":"12",datefmt:datefmtStr,units,appearance:q.get("appearance")==="contrast"?"contrast":"glass",lp:LPOLL,source:"hash"};
    bindConfig(CONFIG);
  }
}

// ---- simulation overrides (only active when present in the hash) ----------
// Lets you preview any condition without waiting for the real clock/weather:
//   simTime=HH:MM   force the wall clock   simWx=<WMO code>  force weather
//   simMoon=0..1    force illuminated frac simWax=1|0        force waxing/waning
//   simMoonAlt=<deg> force moon altitude    simMoonH=<deg>   force moon hour angle (−180 rising .. +180 setting)
//   simTemp=<n>     force the shown temp     simFeels=<n>     force apparent (feels-like) temp
//   simWind=<m/s>   simWindDir=<deg FROM>    simHumid=<RH %>  simCloud=<cover %>
const SIM = {

  try{ localStorage.setItem(key,JSON.stringify({date:dateStr,data:admitted.data})); }catch(e){}
}
async function fetchTimings(dateStr,operation=null){
  const op=operation||beginRequest("current",dateStr), own=!operation;
  if(!op || !requestEligible(op)) throw new Error("obsolete prayer request");
  // Pure transport: only guarded caller adoption may change the resolved timezone or cache.
  const u=`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${enc(op.lat)}&longitude=${enc(op.lon)}&method=${enc(op.method)}&school=${enc(op.school)}`;
  let err;
  try{
    while((op.prayerAttempts||0)<3){
      if(!requestEligible(op)) throw new Error("obsolete prayer request");
      op.prayerAttempts=(op.prayerAttempts||0)+1;
      const a=beginAttempt(op,10000); a.requestedDay=dateStr;
      try{
        const deadline=new Promise((resolve,reject)=>{
          a.cancel=()=>{ a.expired=true; if(a.controller) a.controller.abort(); reject(new Error("prayer attempt unavailable")); };
          a.timer=setTimeout(a.cancel,10000);
        });
        const body=(async()=>{
          const r=await fetch(u,{cache:"no-store",referrerPolicy:"no-referrer",...(a.controller?{signal:a.controller.signal}:{})});
          if(r.ok!==true) throw new Error("bad api HTTP");
          const j=await r.json();
          if(!recordObject(j) || (j.code!=null&&j.code!==200) || (j.status!=null&&j.status!=="OK")) throw new Error("bad api envelope");
          const admitted=admitPrayerRecord(j.data,dateStr);
          if(!admitted.ok) throw new Error("bad api "+admitted.reason);
          if(!attemptEligible(op,a)) throw new Error("obsolete prayer attempt");
          return admitted.data;
        })();
        const data=await Promise.race([body,deadline]);
        if(!attemptEligible(op,a)) throw new Error("obsolete prayer attempt");
        op.completedAttempt=a; return data;
      }catch(e){
        err=e; if(!requestEligible(op)) throw e;
      }finally{ finishAttempt(op,a); }
      if(op.prayerAttempts<3) await sleep(900*op.prayerAttempts);
    }
    throw err||new Error("prayer attempt budget exhausted");
  }finally{ if(own) finishRequest(op); }
}

    n=projectInZone(_prayerDayFormatter,simNow());

function prayerNextDay(day){

  const [d,mo,y]=day.split("-").map(Number), ms=utcFields(y,mo,d);

}

  if(op && op.kind==="prefetch" && admitted.timezone!==tz) return false;

  const op=beginPrayerRequest("prefetch",day); if(!op) return;

    .catch(()=>{}).finally(()=>{ finishPrayerRequest(op); });

    if(prayerRecordReady(tomorrow,day)) adoptPrayerBundle(tomorrow,day);

function _sunCoords(d){ const M=_RAD*(357.5291+0.98560028*d), C=_RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)), L=M+C+_RAD*102.9372+Math.PI; return {dec:_dec(L,0), ra:_ra(L,0)}; }
function _moonCoords(d){ const L=_RAD*(218.316+13.176396*d), M=_RAD*(134.963+13.064993*d), F=_RAD*(93.272+13.229350*d), l=L+_RAD*6.289*Math.sin(M), b=_RAD*5.128*Math.sin(F), dt=385001-20905*Math.cos(M); return {ra:_ra(l,b), dec:_dec(l,b), dist:dt}; }
// illuminated fraction + waxing flag (waxing = sign of the bright-limb angle χ, Meeus 48.5; χ is computed internally only — the moon renders upright, so χ is no longer returned)
function moonIllum(date){
  const d=_toDays(date), s=_sunCoords(d), m=_moonCoords(d), sd=149598000;
  const phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  const inc=Math.atan2(sd*Math.sin(phi), m.dist-sd*Math.cos(phi));
  const chi=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra), Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
  return {fraction:(1+Math.cos(inc))/2, waxing:chi<0};   // χ's SIGN gives waxing; χ itself is no longer returned (the moon renders upright — no parallactic rotation). moonParallactic() was removed as dead code (its only caller was the removed χ−q rotation).
}
// real Moon altitude (degrees) + local hour angle H (degrees, wrapped −180..180) — the motion inputs that
// drive the cinematic moon's rising/setting path. H<0 = east/rising, H=0 = transit (highest), H>0 = west/setting.
function moonAltAz(date, latDeg, lonDeg){
  const lw=_RAD*-lonDeg, ph=_RAD*latDeg, d=_toDays(date), c=_moonCoords(d);
  let H=_sid(d,lw)-c.ra; H=Math.atan2(Math.sin(H),Math.cos(H));
  const alt=Math.asin(Math.sin(ph)*Math.sin(c.dec)+Math.cos(ph)*Math.cos(c.dec)*Math.cos(H));
  return {alt:alt/_RAD, H:H/_RAD};
}
// Galactic centre (Sagittarius, RA 17h45.6m=266.4°, Dec −28.94°) — its altitude sets how prominent the Milky
// Way reads (the bright bulge is up vs the faint outer arm), and its hour angle tilts the band as the sky turns.
const _GCRA=266.4*_RAD, _GCDEC=-28.94*_RAD;
function mwGeom(date, latDeg, lonDeg){
  const lw=_RAD*-lonDeg, ph=_RAD*latDeg, d=_toDays(date);
  let H=_sid(d,lw)-_GCRA; H=Math.atan2(Math.sin(H),Math.cos(H));
  const alt=Math.asin(Math.sin(ph)*Math.sin(_GCDEC)+Math.cos(ph)*Math.cos(_GCDEC)*Math.cos(H));
  return {alt:alt/_RAD, H:H/_RAD};
}

// ---- moon phase (synodic) ------------------------------------------------
function moonPhase(date){
  const synodic=29.530588853;
  const ref=Date.UTC(2000,0,6,18,14,0)/86400000;        // known new moon
  const now=date.getTime()/86400000;
  const phase=(((now-ref)%synodic)+synodic)%synodic/synodic;   // 0 new .. .5 full .. 1 new
  const frac=(1-Math.cos(2*Math.PI*phase))/2;            // illuminated fraction
  return {phase, frac, waxing:phase<0.5};
}

  const px=mx-(dy/len)*off, py=my+(dx/len)*off;
  _midDisp(x0,y0,px,py,disp*0.6,depth-1,rnd,out);
  _midDisp(px,py,x1,y1,disp*0.6,depth-1,rnd,out);
}
function _poly(out){ let d="M"+out[0].toFixed(0)+" "+out[1].toFixed(0); for(let i=2;i<out.length;i+=2) d+=" L"+out[i].toFixed(0)+" "+out[i+1].toFixed(0); return d; }

  const rnd=_mb32((seed*2654435761)>>>0);
  const x0=120+rnd()*120, y0=8+rnd()*24;                         // origin at the upper cloud-base band
  const reach=0.4+0.55*rnd();                                    // how far down it descends (sometimes the lower third)
  const x1=x0+(rnd()-0.5)*100, y1=y0+reach*470;
  const main=[x0,y0]; _midDisp(x0,y0,x1,y1,64,6,rnd,main);
  let d=_poly(main);
  const nb=2+(rnd()*3|0);                                        // 2-4 forked branches
  for(let i=0;i<nb;i++){
    const k=(4+(rnd()*(main.length-6)|0))&~1, bx=main[k]||x0, by=main[k+1]||y0;
    const side=rnd()<0.5?-1:1, blen=30+80*rnd();

}

// The post-config WEATHER pipeline, factored out of boot() so the settings panel's live
// Apply (applyConfig) re-runs the SAME path — one source of truth, no page reload.
function startWeather(deferNetwork=false){
  loadWx();
  if(SIM.wx!=null){
    const sTemp=SIM.temp!=null?+SIM.temp:72, sRh=SIM.humid!=null?+SIM.humid:45;
    const tC=units==="f"?(sTemp-32)*5/9:sTemp, dC=tC-(100-Math.max(1,Math.min(100,sRh)))/5;   // derive dew point from temp+RH (Magnus approx) so simHumid drives the dew-point haze/blur
    // default a code-appropriate synthetic preview precip so a bare simWx still shows its precip visuals; simPrecip overrides
    // it (e.g. simWx=95&simPrecip=0 → a "forecast thunder but dry" case the gate must downgrade).
    const sCls=wxClass(+SIM.wx), defP=(sCls==="thunder")?5:(sCls==="rain")?2:(sCls==="drizzle")?0.3:(sCls==="snow")?1:0;
    weather={code:+SIM.wx, temp: sTemp,
      feels: SIM.feels!=null?+SIM.feels:sTemp, rh: sRh, dew: units==="f"?dC*9/5+32:dC,
      wind: SIM.wind!=null?+SIM.wind:3, windDir: SIM.windDir!=null?+SIM.windDir:225,
      gust: (SIM.wind!=null?+SIM.wind:3)+2, cloud: SIM.cloud!=null?+SIM.cloud:0, precip: SIM.precip!=null?+SIM.precip:defP,
      vis: SIM.humid!=null&&+SIM.humid>92?2000:20000, isDay:1, src:"sim"};
  }
  if(!deferNetwork){fetchWeather(); fetchRadar();}
}
// The post-config PRAYER-DATA pipeline (cache → live fetch → render).
async function loadPrayerData(){
  if(!simulationReady() || lat==null || lon==null) return;
  const op=beginPrayerRequest("current",prayerCivilDay()); if(!op) return;
  try{
    const cached=readPrayerCache(op.cacheKey);
    if(cached && requestEligible(op)){
      tz=cached.timezone;                                    // validated selected-envelope metadata, before requested-day filtering
      if(!simulationReady()) return;
      const day=prayerCivilDay();
      if(cached.date===day && adoptPrayerBundle(cached.data,day,op,true,false) && !_loopStarted){
        render();
        // Adopting the first prayer scene clears the earlier sky preview.
        // Republish its accepted target in this turn, before network/rAF yield.
        window.SalahSkyPreview?.update(); _renderDirty=false;
      }
    }
    if(!requestEligible(op)) return;
    let requested=prayerCivilDay(); op.requestedDay=requested; op.requestZone=tz;
    _prayerCooldown.current.day=requested;
    let data=await fetchTimings(requested,op);
    if(!prayerResultEligible(op)) return;
    tz=data.meta.timezone;                                   // guarded bootstrap metadata never paints the hint-day payload as current
    if(!simulationReady()) return;
    let day=prayerCivilDay(); _prayerCooldown.current.day=day;
    if(day!==requested){
      requested=day; data=await fetchTimings(requested,op);   // at most one corrected-day request, within the same three-attempt budget
      if(!prayerResultEligible(op)) return;
      tz=data.meta.timezone;
      if(!simulationReady()) return;
      day=prayerCivilDay(); _prayerCooldown.current.day=day;
    }
    if(adoptPrayerBundle(data,requested,op) && !_loopStarted){
      render(); window.SalahSkyPreview?.update(); _renderDirty=false;
    }
    else if(!today && requestEligible(op)) showError("Could not load prayer times");
  }catch(e){
    if(requestEligible(op) && !today) showError("Could not load prayer times");
  }finally{ finishPrayerRequest(op); }
}

// Apply a new WidgetConfig at RUNTIME (settings panel) — IN-MEMORY, no reload, so it still
// works when third-party-iframe localStorage is blocked/partitioned. opts.save persists it.
async function applyConfig(cfg, opts){
  opts=opts||{};
  cfg=window.SalahConfig?SalahConfig.normalize(cfg):cfg;
  if(opts.save && window.SalahConfig){
    const r=SalahConfig.saveLocal(cfg);
    _publishPersistence("save",r);                 // publish before any awaited provider work
    if(r.ok){ cfg.origin=cfg.origin||cfg.source; cfg.source="localStorage"; cfg.savedAt=r.savedAt; }   // acquisition evidence and original origin survive the storage marker
  }
  beginRuntimeGeneration();
  bindConfig(cfg);
  resetForNewLocation();
  if(!simulationReady()) return;
  if(lat==null||lon==null){ render(); return; }     // incomplete manual entry → nothing to load yet
  startWeather();
  const generation=_runtimeGeneration;
  await loadPrayerData();
  if(generation!==_runtimeGeneration) return;
  startRenderLoop();                                  // no-op if already running
}

// Diagnostic control of the EXISTING native clock, with an explicit live return.
// No private renderer time or altered transport deadlines. Every transition
// invalidates pending sky/Moon work, including A -> preview -> live A, before
// publishing the new native target. It does not persist settings or seek Date.
window.SalahClock=Object.freeze({set({rate=TIMESCALE,utcMs=null,live=false}={}){
  if(!Number.isFinite(rate)||rate<0||utcMs!=null&&(!Number.isFinite(utcMs)||Math.abs(utcMs)>8640000000000000))throw new RangeError("Invalid native clock control");
  const next=live?Date.now():utcMs??simNow();if(!Number.isFinite(next))throw new RangeError("Native clock requires an accepted time");
  TIMESCALE=live?1:rate;FOLLOW_WALL_CLOCK=!!live;ADVANCING=!live&&rate>0;_clockPreview=!live;
  _simBase=next;_rafT0=_RAFNOW();_simTz=tz;_simValid=true;_simInvalidTz=null;
  window.SalahRealSky?.invalidate("explicit native clock control");window.SalahSkyPreview?.clear("explicit native clock control");beginSkyScene();
  if(live&&weather?.src==="forecast"){weather=null;loadWx();fetchWeather();}
  _wxDecisionCache=null;lastMoonMin=-1;_renderDirty=true;
  const c=$(".c"),sc=$(".simclock");c?.classList.toggle("fast",ADVANCING);if(sc)sc.style.display=live?"none":"block";
  maintainPrayerDay();render();window.SalahNativeSkyHost?.notify();
  return {utcMs:simNow(),rate:TIMESCALE,live:FOLLOW_WALL_CLOCK};
}});

async function boot(){
  const generation=_runtimeGeneration;
  if(_cfgMode==="local"||_cfgMode==="preferLocal") enableSettingsAffordance();  // recovery controls do not depend on a valid scene
  beginSkyScene();
  if(!simulationReady()) return;
  if(QA){ lastWxAt=0; lastWxTry=0; }                          // QA: always build a fresh forecast track on boot (cache must not block it)
  buildSceneOnce();
  renderMoon();

  // ---- resolve coordinates (mode-aware: hardcoded sync above; local resolves here) ----
  if(lat==null||lon==null){
    window.SalahStartSkyPreview?.();
    if(_needsDetect && window.SalahConfig){
      // local / preferLocal with no saved config → coarse, PERMISSION-FREE area auto-detect.
      _autoDetectStatus="pending";
      let det=null; try{ det=await SalahConfig.coarseDetect(); }catch(e){ det={ok:false}; }
      if(generation!==_runtimeGeneration) return;
      if(det && det.ok){
        bindConfig(SalahConfig.applyHashPrefs(det.cfg,_hashCfg));
        _autoDetectStatus="ok"; _autoDetectSource=det.provider||det.source||"coarse-ip";
        enableSettingsAffordance();
      } else {
        // detect failed/blocked/rate-limited → open manual setup (never crash). Sky still
        // animates behind the panel; entering coordinates then closing (auto-save) brings prayer times to life.
        _autoDetectStatus="failed";
        enableSettingsAffordance();
        openSettings();
        startRenderLoop();
        return;
      }
    } else {
      showError("Add lat & lon to the URL");                  // bare mode: byte-identical to before
      return;
    }
  }

  if(!simulationReady()) return;                            // coordinate detection may have changed the explicit scene's zone
  startWeather(true); // Retained/explicit weather participates in the first scene.
  render(); // Current shell/header and explicit pending prayer rows precede network settlement.
  // The first native paint adopts its scene key and invalidates the head
  // preview. Republish accepted inputs before yielding: a cache-warm browser
  // can present this turn before the first rAF, exposing the dark base colour.
  // The initial foreground must follow current native geometry. Starting it
  // before render() built a complete preview only to discard it in that same
  // turn. Unknown-location acquisition already created its waiting owner.
  if(window.SalahSkyPreview) window.SalahSkyPreview.update();
  else window.SalahStartSkyPreview?.();
  // The complete celestial scene and settings controls are already published.
  // Let the browser present them before synchronous cached timetable fitting
  // (or a very fast provider response) consumes another long main-thread turn.
  // This is a paint opportunity, not a timer, hidden shell or asset-ready gate.
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
    // Resolving inside rAF resumes this async function as a microtask BEFORE
    // that rendering step finishes. Queue an ordinary task instead, so cached
    // timetable fitting cannot occupy the same rendering callback. No timer or
    // claim of monitor presentation is attached to this scheduling boundary.
    const turn=new MessageChannel();
    turn.port1.onmessage=()=>{turn.port1.close();turn.port2.close();resolve();};
    turn.port2.postMessage(null);
  })));
  if(generation!==_runtimeGeneration) return;
  // Start fresh observation transport after that first paint opportunity. A
  // fast response otherwise invalidates and recomputes the just-built sky in
  // its first rAF. Cached weather was consumed above; no observation is hidden.
  fetchWeather(); fetchRadar();
  await loadPrayerData();
  if(generation!==_runtimeGeneration) return;
  startRenderLoop();
}

// SINGLE rAF render clock, factored into a function so the settings-panel Apply can (re)start it.
// Renders on each sim-second (≈1 Hz at timeScale 1; up to per-frame when fast), so the marker, sky,
// prayer state and moon all advance from simTime. Decorative weather motion lives in CSS
// (wind/precip-driven), independent of this clock. Stops entirely when the iframe is hidden/offscreen.
function startRenderLoop(){
  if(!simulationReady()) return;
  if(_loopStarted) return; _loopStarted=true;
  const cEl=document.querySelector(".c");
  if(MOTIONFULL && cEl) cEl.classList.add("motionfull");    // CSS reduced-motion rules are scoped to .c:not(.motionfull)
  let _raf=null, _onScreen=true, _lastSec=-1, _lastWx=0, _lastCloud=0;
  const visible=()=>_onScreen && document.visibilityState!=="hidden";
  // —— MOTION TELEMETRY (&debugMotion=1): prove the sky is actually alive in normal real-time ——
  let _rafN=0,_cloudN=0,_tickAcc=_RAFNOW(),_rafPS=0,_cloudPS=0;   // loop rate counters (consumed only by the debugMotion overlay, which now lives at module scope)
  function loop(){
    _rafN++;
    if(!simulationReady()){ _raf=requestAnimationFrame(loop); return; }
    const n=nowParts();
    maintainPrayerDay();                               // promotion, rollover and cold same-day recovery share this visible opportunity
    const rt=_RAFNOW();
    if(!ADVANCING && rt-_lastWx>30000){ _lastWx=rt; fetchWeather(); fetchRadar(); }    // refresh real weather ~½-min + radar (self-throttled ~10min); both held during a fast sweep
    const sec=Math.floor(simNow()/1000);
    if(sec!==_lastSec || _renderDirty){ _lastSec=sec; _renderDirty=false; render(); if(ADVANCING) updateSimClock(n); }
    // Cloud evolution uses bounded visual intervals, with CLOCK's preview rate. Reduced-motion
    // paints changed state at the same held axes, never a substitute epoch like 1000.
    const reduced=isMotionReduced(); syncCloudMotionPreference(reduced,rt);
    if(reduced){ if(_cloudDirty){ paintClouds(simNow()/1000); tieRainToClouds(); _cloudN++; } }
    else if(rt-_lastCloud>76){ _lastCloud=rt; paintClouds(simNow()/1000); tieRainToClouds(); _cloudN++; }
    if(rt-_tickAcc>=1000){ _rafPS=Math.round(_rafN*1000/(rt-_tickAcc)); _cloudPS=Math.round(_cloudN*1000/(rt-_tickAcc)); _rafN=0;_cloudN=0;_tickAcc=rt; if(DEBUGMOTION) updateMotionDbg(_rafPS,_cloudPS,cEl); }
    // Optional sky presents after native UI/cloud work, using a freshly
    // accepted UTC. Bootstrap owns its own callback until this handoff.
    window.SalahSkyPreview?.present(_RAFNOW());
    _raf=requestAnimationFrame(loop);
  }
  function start(){ if(!_raf) _raf=requestAnimationFrame(loop); }
  function stop(){ if(_raf){ cancelAnimationFrame(_raf); _raf=null; } }
  function setVis(){ const on=visible(); rebaseCloudMotion(!on); if(cEl){ cEl.classList.toggle("paused",!on); if(ADVANCING) cEl.classList.add("fast"); } if(on) start(); else stop(); }
  document.addEventListener("visibilitychange",setVis);
  if("IntersectionObserver" in window && cEl)
    new IntersectionObserver(es=>{ _onScreen=es[0].isIntersecting; setVis(); },{threshold:0}).observe(cEl);
  if(ADVANCING){ const sc=document.querySelector(".simclock"); if(sc) sc.style.display="block"; }
  setVis();
}

function _renderPersistenceAffordance(){

// A dialog session and location edit own every async lookup, including GPS and

function _newerSetPrefs(owner){

// Pin colours distinguish area/browser/site; browser provenance does not prove
// the device is still there. Saved fixes keep their original epoch and accuracy.

  b.classList.add(src==="precise"?"glow":src==="ip"?"lit":"off");
  const evidence=_setLocationEvidence, accuracy=evidence && evidence.accuracyM!=null ? evidence.accuracyM+" m" : "unknown";
  const age=evidence && evidence.acquiredAt!=null && evidence.acquiredAt<=Date.now() ? Math.floor((Date.now()-evidence.acquiredAt)/60000)+" min old" : "time unknown";

// forward-geocode search on the location field (same shared SalahConfig.geocodeSearch as the builder):

  _setLocationEvidence=window.SalahConfig?SalahConfig.placeLocationEvidence(c):null; _setLocationOrigin="place"; _setLocationSaved=false;
  _setCandOwner.label=_byId("set-label").value;              // cycling owns its programmatic display-name update

// date format: keep the preset dropdown in sync with the editable code box (mirrors builder.html)
const _DF_PRESETS=["YYYY-MM-DD","MM/DD/YYYY","DD/MM/YYYY","DD MMMM YYYY"];
function _syncDateFromBox(){ const dd=_byId("set-datefmt-preset"); if(!dd) return; const code=_byId("set-datefmt").value.trim(); dd.value=(_DF_PRESETS.indexOf(code)>=0)?code:"__custom__"; }

function _enableSettingsAffordance(){
  const b=document.querySelector(".buckle"); if(!b) return;
  const c=document.querySelector(".c"); if(c) c.classList.add("cfg-local");
  if(b.classList.contains("interactive")) return;             // idempotent
  b.classList.add("interactive");
  b.setAttribute("role","button"); b.setAttribute("tabindex","0"); b.setAttribute("aria-label","Widget settings");
  if(!b.querySelector(".gear")){ const g=document.createElement("span"); g.className="gear"; g.textContent="⚙"; g.setAttribute("aria-hidden","true"); b.appendChild(g); }
  _renderPersistenceAffordance();
  b.addEventListener("click",_toggleSettings);
  b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); _toggleSettings(); } });
}

function _settingsFormToConfig(){
  const g=_byId, base={ lat:g("set-lat").value.trim(), lon:g("set-lon").value.trim(),
    label:g("set-label").value.trim(), method:g("set-method").value, school:g("set-school").value,
    time:g("set-time").value, units:g("set-units").value,
    appearance:g("set-appearance").value,
    datefmt:g("set-datefmt").value.trim()||"YYYY-MM-DD",
    tz:(CONFIG&&CONFIG.tz)||tz, lp:LPOLL, locationEvidence:_setLocationEvidence,
    source:_setLocationOrigin };

}
function _populateSettingsForm(){

  g("set-label").value = label||""; g("set-method").value=method; g("set-school").value=school;
  g("set-time").value=fmt24?"24":"12"; g("set-units").value=units; g("set-datefmt").value=datefmtStr;
  g("set-appearance").value=(CONFIG&&CONFIG.appearance)||"glass";

  _setLocationOrigin=(CONFIG&&(CONFIG.origin||CONFIG.source))||"manual"; _setLocationSaved=!!CONFIG&&CONFIG.source==="localStorage";

function _wireSettings(){

  _byId("set-reset").addEventListener("click",_resetLocal);

  const panel=_byId("settings");

    if(e.key==="Escape"){ e.preventDefault(); _closeSettings(); return; }

      if(!f.length) return;

  }));

  });
}
// AUTO-SAVE: there is no Save button — the current form is applied + persisted when the panel closes

async function _usePrecise(){    // the map-pin button → precise GPS (only place getCurrentPosition is called)

  if(!_ownsSetLookup(owner)) return;

  if(!_ownsSetLookup(owner)) return;
  _geoPermission=permission;
  if(r.ok){ _byId("set-lat").value=(+r.lat).toFixed(5); _byId("set-lon").value=(+r.lon).toFixed(5); _geoLastError=null;
    _setLocationEvidence=r.locationEvidence||SalahConfig.normalize({source:"browser-geolocation"}).locationEvidence; _setLocationOrigin="browser-geolocation"; _setLocationSaved=false;
    _setPin("precise"); _setDirty=true;

async function _resetLocal(){

  }
  _setStatus("Detecting your area…");
  let d=null; try{ if(window.SalahConfig) d=await SalahConfig.coarseDetect(); }catch(e){}
  if(!_ownsSetLookup(owner)) return;
  if(d&&d.ok){ const c=SalahConfig.applyHashPrefs(d.cfg,_hashCfg);
    // Reset still owns the detected location, while preferences edited since
    // dispatch (or during apply's await) own their fields and their close-save.

function _openSettings(){

function _closeSettings(){

  else if(_setLastFocus&&_setLastFocus.focus){ try{ _setLastFocus.focus(); }catch(e){} }
}
function _toggleSettings(){ const c=document.querySelector(".c"); if(!c) return; c.classList.contains("settings-open")?_closeSettings():_openSettings(); }

// Authored MB1 boundary: this is the only producer of native phase/time identity.
window.SalahMoonHost=Object.freeze({
 capture(){
  const identity=skySceneIdentity();
  return {utcMs:simNow(),generation:_runtimeGeneration,sceneIdentity:identity,
   fraction:moonSky.frac,waxing:!!moonSky.waxing,up:moonSky.up,
   presentationReady:_skySceneKey!==null,initialWarranted:_skyMoonPresence>0,
   maximumPresentationRatio:MOON_SCALE_MAX/(MOON_SCALE_MIN+(MOON_SCALE_MAX-MOON_SCALE_MIN)*clamp(moonSky.up)),
   dpr:Math.max(.5,Math.min(4,window.devicePixelRatio||1)),timeScale:TIMESCALE,
   paused:document.hidden||!!$('.c')?.classList.contains('paused')};
 },
 publish(canvas){const ph=$('.mphoto');if(ph)ph.setAttribute('href',canvas.toDataURL());updateSkySurface();},
 fallback(){
  // Resilience means a usable widget and retry, not silently substituting the
  // old Moon. The mask follows the same admission as the material surface.
  updateSkySurface();
 },
});

boot();
</script>
