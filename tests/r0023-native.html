<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'none'; base-uri 'self'; form-action 'none'">
<title>CONFIG isolated native fixture</title></head>
<body><pre id="fixture-error">Loading exact CONFIG/page source with private storage and synthetic location…</pre>
<script>
// Test-only wrapper for the parent's exclusive browser lease. Full production
// page/config script bodies are retained. Font resources are suppressed; location,
// prayer dates and service results are synthetic, not the viewer's location.
(function(){
  "use strict";
  const nativeFetch=window.fetch.bind(window),NativeDate=Date,query=new URLSearchParams(location.search),rootURL=new URL("../",location.href);
  const page=query.get("page")||"widget",seed=query.get("seed")||"manual",gps=query.get("gps")||"success",detect=query.get("detect")||"success",deny=query.get("deny")||"none";
  let now=NativeDate.parse("2026-10-02T12:00:00Z");
  const bytes=new Map(),pendingGPS=[],key="salah_widget:config:v1";
  const report=window.__locationFixture={wrapperURL:location.href,page,seed,gps,detect,deny,state:"setup",sourceSha256:null,configSha256:null,error:null,
    fonts:"system fallback; known remote fonts suppressed",clock:"fixed synthetic UTC epoch",storageEvents:[],requests:[],gpsCalls:[],errors:[]};
  report.advance=ms=>{now+=Number(ms);};
  report.denySave=false;report.denyRemove=false;
  const privateStore={get length(){return bytes.size;},key:n=>[...bytes.keys()][n]??null,
    getItem:k=>{report.storageEvents.push(["get",String(k)]);return bytes.get(String(k))??null;},
    setItem:(k,v)=>{k=String(k);report.storageEvents.push(["set",k]);if(k===key&&report.denySave)throw new DOMException("fixture blocked","SecurityError");bytes.set(k,String(v));},
    removeItem:k=>{k=String(k);report.storageEvents.push(["remove",k]);if(k===key&&report.denyRemove)throw new DOMException("fixture blocked","SecurityError");bytes.delete(k);}};
  function failure(error){report.state="error";report.error=String(error&&error.message||error);const el=document.getElementById("fixture-error");if(el)el.textContent="Fixture setup error: "+report.error;}
  function json(value,status=200){return Promise.resolve(new Response(JSON.stringify(value),{status,headers:{"Content-Type":"application/json"}}));}
  function prayer(day){const parts=day.split("-"),month=Number(parts[1]);if(parts.length!==3||month<1||month>12)throw Error("Unexpected prayer date");
    return {data:{timings:{Fajr:"05:00",Sunrise:"06:00",Dhuhr:"12:00",Asr:"15:30",Sunset:"18:00",Maghrib:"18:00",Isha:"19:30"},meta:{timezone:"UTC"},date:{gregorian:{date:day,day:parts[0],month:{number:month},year:parts[2]},hijri:{day:"01",month:{number:1,en:"Synthetic month"},year:"1500"}}}};}
  function fixtureFetch(input,init){const u=new URL(typeof input==="string"||input instanceof URL?String(input):input.url,location.href);report.requests.push({url:u.href,at:now});
    if(u.href==="https://get.geojs.io/v1/ip/geo.json"||u.href==="https://ipinfo.io/json"){
      if(detect==="fail")return json({error:"synthetic detection failure"},503);
      return u.hostname==="get.geojs.io"?json({latitude:"24.47",longitude:"39.61",city:"Madinah",country:"Saudi Arabia",country_code:"SA",accuracy:"5"}):json({loc:"51.5,-0.12",city:"London",country:"GB"});
    }
    if(u.origin==="https://api.aladhan.com"&&u.pathname.startsWith("/v1/timings/"))return json(prayer(u.pathname.slice("/v1/timings/".length)));
    if(u.origin==="https://nominatim.openstreetmap.org")return json([{class:"place",lat:"52.52",lon:"13.41",address:{city:"Berlin",country:"Germany",country_code:"de"},boundingbox:["52","53","13","14"]}]);
    if(u.origin==="https://api.zippopotam.us")return json({places:[]});
    if(u.origin==="https://api.bigdatacloud.net")return json({city:"Berlin",countryCode:"DE",continentCode:"EU"});
    if(u.origin==="https://api.open-meteo.com"||u.hostname.includes("rainviewer"))return json({error:"weather unavailable in CONFIG fixture"},503);
    report.errors.push("Unexpected request: "+u.href);return Promise.reject(Error(report.errors.at(-1)));
  }
  function completeGPS(index){const job=pendingGPS[index];if(!job||job.completed)return;job.completed=true;
    if(gps==="denied"||gps==="timeout"){job.bad({code:gps==="denied"?1:3,message:gps});return;}
    const pos={coords:{latitude:52.52,longitude:13.41,accuracy:gps==="missing"?undefined:25},timestamp:gps==="missing"?undefined:gps==="cached"?now-300000:gps==="future"?now+1:now};job.ok(pos);
  }
  report.releaseGPS=completeGPS;
  report.inspect=()=>({state:report.state,error:report.error,config:typeof window.qaState==="function"?window.qaState().config:null,
    form:typeof window.formConfig==="function"?window.formConfig():Object.fromEntries(["set-label","set-lat","set-lon","set-method","set-units"].map(id=>[id,document.getElementById(id)?.value])),
    status:document.getElementById("set-status")?.textContent||document.getElementById("geotip")?.textContent,
    openerName:document.querySelector(".buckle")?.getAttribute("aria-label"),storage:[...bytes],gpsCalls:report.gpsCalls,requests:report.requests});
  async function source(file){const r=await nativeFetch(new URL(file,rootURL),{cache:"no-store"});if(!r.ok)throw Error(file+" HTTP "+r.status);const data=await r.arrayBuffer();return {text:new TextDecoder("utf-8",{fatal:true}).decode(data),sha:[...new Uint8Array(await crypto.subtle.digest("SHA-256",data))].map(b=>b.toString(16).padStart(2,"0")).join("")};}
  async function start(){
    if(!["widget","builder"].includes(page)||!["manual","browser","legacy","none"].includes(seed)||!["success","cached","denied","timeout","unsupported","missing","future","held"].includes(gps)||!["none","save","reset"].includes(deny)||!["success","fail"].includes(detect))throw Error("Unknown fixture option");
    const [pageSource,configSource]=await Promise.all([source(page==="builder"?"builder.html":"index.html"),source("config.js")]);report.sourceSha256=pageSource.sha;report.configSha256=configSource.sha;
    const scripts=[...pageSource.text.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];if(scripts.length!==2||!/src="config\.js"/.test(scripts[0][1])||scripts[1][1].trim())throw Error("Page script anchors changed");
    Object.defineProperty(window,"localStorage",{configurable:true,get:()=>privateStore});
    class FixtureDate extends NativeDate{constructor(...args){super(...(args.length?args:[now]));}static now(){return now;}}window.Date=FixtureDate;window.fetch=fixtureFetch;
    Object.defineProperty(navigator,"geolocation",{configurable:true,value:gps==="unsupported"?undefined:{getCurrentPosition:(ok,bad,opts)=>{const index=pendingGPS.length;pendingGPS.push({ok,bad});report.gpsCalls.push({index,options:opts,at:now});if(gps!=="held")setTimeout(()=>completeGPS(index),0);}}});
    Object.defineProperty(navigator,"permissions",{configurable:true,value:{query:async()=>({state:gps==="denied"?"denied":"granted"})}});
    window.__seedLocationFixture=()=>{if(seed!=="none"){
      const c={v:1,lat:51.5,lon:-.12,label:"London",method:"3",units:"f",source:seed==="manual"?"manual":"browser-geolocation"};
      if(seed==="browser")c.locationEvidence={intent:"device-position",source:"browser-geolocation",accuracyM:25,acquiredAt:now-86400000,provider:null,area:null,bounds:null};
      if(seed==="legacy")bytes.set(key,JSON.stringify({...c,savedAt:now}));else if(!SalahConfig.saveLocal(c).ok)throw Error("Fixture seed failed");
    }report.denySave=deny==="save";report.denyRemove=deny==="reset";};
    const doc=new DOMParser().parseFromString(pageSource.text,"text/html"),originalScripts=doc.querySelectorAll("script"),module=originalScripts[0],runtime=originalScripts[1];
    module.removeAttribute("src");module.textContent=configSource.text;const seedScript=doc.createElement("script");seedScript.textContent="window.__seedLocationFixture();";runtime.before(seedScript);
    const knownFonts=new Set(["https://fonts.googleapis.com","https://fonts.gstatic.com","https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap"]);
    for(const el of doc.querySelectorAll("link[href]")){const raw=el.getAttribute("href"),u=new URL(raw,rootURL);if(u.origin===rootURL.origin)continue;if(!knownFonts.has(raw))throw Error("Unreviewed font/resource: "+raw);el.remove();}
    const base=doc.createElement("base");base.href=rootURL.href;doc.head.prepend(base);
    const wrapped="<!doctype html>"+doc.documentElement.outerHTML,after=[...wrapped.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
    if(after.length!==3||after[0][2]!==configSource.text||after[2][2]!==scripts[1][2])throw Error("Production script body changed during wrapping");
    // Builder derives output URLs from location.href. Preserve its production URL
    // shape; reload this fixture using report.wrapperURL to re-establish isolation.
    history.replaceState(null,"",new URL((page==="builder"?"builder.html":"index.html")+location.hash,rootURL));
    report.state="loading";document.open();window.addEventListener("error",e=>{report.errors.push(e.message);failure(e.message);});window.addEventListener("unhandledrejection",e=>{report.errors.push(String(e.reason));failure(e.reason);});
    document.addEventListener("DOMContentLoaded",()=>{try{report.storageIsolated=window.localStorage===privateStore;report.clockFixed=Date.now()===now;
      if(!report.storageIsolated||!report.clockFixed||!window.SalahConfig||(page==="widget"?typeof window.qaState!=="function":typeof window.formConfig!=="function"))throw Error("Actual source or isolated hooks did not initialize");report.state=report.error?"error":"ready";
    }catch(e){failure(e);}},{once:true});document.write(wrapped);document.close();
  }
  start().catch(failure);
})();
</script></body></html>
