<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'none'; base-uri 'self'; form-action 'none'">
<title>R0017 isolated widget fixture</title>
</head>
<body><pre id="fixture-error">Loading verified widget source…</pre>
<script>
// Test-only transport/document wrapper. Widget script bodies are never rewritten.
(function(){
  "use strict";
  const nativeFetch=window.fetch.bind(window),NativeDate=window.Date;
  const query=new URLSearchParams(location.search),mode=query.get("mode")||"healthy";
  const attempt=Number(query.get("attempt")),hash=location.hash.slice(1),run=query.get("run")||"direct-fixture";
  const fixed=NativeDate.parse("2026-09-07T09:30:00.000Z"),rootURL=new URL("../",location.href);
  let clockNow=fixed;
  const documentId=crypto.randomUUID(),ownedDocument=document;
  const policy="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'none'; base-uri 'self'; form-action 'none'";
  const report=window.__widgetFixture={mode,run,attempt,documentId,hash,state:"setup",error:null,sourceSha256:null,
    weatherOracle:"joined R0024: useful model; local permission requires admitted synthetic fixture",bridgeSha256:null,
    storageIsolated:false,clockFixed:false,clockNow:fixed,fetchIntercepted:false,initialStorageEntries:0,ledger:[],storageEvents:[],consoleErrors:[],weatherEvents:[]};
  const identity=()=>({run,attempt,documentId,hash,sourceSha256:report.sourceSha256});
  function assertOwned(owner){
    if(!owner||owner.run!==run||owner.attempt!==attempt||owner.documentId!==documentId||owner.hash!==hash||owner.sourceSha256!==report.sourceSha256||
      document!==ownedDocument||window.__widgetFixture!==report||location.hash.slice(1)!==hash||report.state!=="ready")
      throw Error("Fixture requires the exact ready attempt/document/source identity");
  }
  function failure(error){report.error=String(error&&error.message||error);report.state="error";
    const el=document.getElementById("fixture-error");if(el)el.textContent="Fixture bootstrap error: "+report.error;}
  // Synthetic data only: Hijri fields are invented test inputs, not date conversions.
  function prayerFixture(day){
    if(day!=="07-09-2026"&&day!=="08-09-2026")throw Error("Unexpected fixture date: "+day);
    const tomorrow=day==="08-09-2026";
    return {data:{timings:{Fajr:"05:00",Sunrise:"06:00",Dhuhr:"12:00",Asr:"15:30",Sunset:"18:00",Maghrib:"18:00",Isha:"19:30"},
      meta:{timezone:"Asia/Riyadh"},date:{
        gregorian:{date:day,day:tomorrow?"08":"07",month:{number:9,en:"September"},year:"2026"},
        hijri:{day:tomorrow?"02":"01",month:{number:1,en:"Synthetic month"},year:"1500"}
      }}};
  }
  // A complete model INPUT, not a local precipitation observation or trusted permission.
  function modelInput(){
    const date=new NativeDate(clockNow+3*3600000),time=date.toISOString().slice(0,16);
    const celsius=new URLSearchParams(hash).get("units")==="c";
    return {time,interval:900,weather_code:95,temperature_2m:celsius?20:68,apparent_temperature:celsius?19:66.2,
      relative_humidity_2m:90,dew_point_2m:celsius?18:64.4,wind_speed_10m:2,wind_direction_10m:180,wind_gusts_10m:4,
      cloud_cover:95,cloud_cover_low:60,cloud_cover_mid:60,cloud_cover_high:30,visibility:20000,is_day:1,
      precipitation:5,rain:5,showers:0,snowfall:0};
  }
  function jsonResponse(value,row){
    const response=new Response(JSON.stringify(value),{status:200,headers:{"Content-Type":"application/json"}}),nativeJson=response.json.bind(response);
    response.json=()=>{row.jsonReads++;row.result="json-consumed";return nativeJson();};return Promise.resolve(response);
  }
  function fixtureFetch(input,init){
    const u=new URL(typeof input==="string"||input instanceof URL?String(input):input.url,location.href);
    const row={attempt,url:u.href,jsonReads:0,result:"requested",cache:init&&init.cache||null};report.ledger.push(row);
    const weatherKeys=["latitude","longitude","current","hourly","forecast_days","temperature_unit","wind_speed_unit","timezone"];
    const currentFields="temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,is_day,weather_code,precipitation,rain,showers,snowfall";
    const hourlyFields="temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,weather_code,visibility,is_day";
    if(u.origin==="https://api.open-meteo.com"&&u.pathname==="/v1/forecast"&&
      u.searchParams.get("latitude")==="24.47"&&u.searchParams.get("longitude")==="39.61"&&u.searchParams.get("timezone")==="Asia/Riyadh"&&
      u.searchParams.get("temperature_unit")===(new URLSearchParams(hash).get("units")==="c"?"celsius":"fahrenheit")&&
      u.searchParams.get("wind_speed_unit")==="ms"&&u.searchParams.get("forecast_days")==="3"&&u.searchParams.get("current")===currentFields&&
      u.searchParams.get("hourly")===hourlyFields&&[...u.searchParams.keys()].length===weatherKeys.length&&[...u.searchParams.keys()].every(k=>weatherKeys.includes(k)))
      return jsonResponse({timezone:"Asia/Riyadh",elevation:100,current:modelInput()},row);
    // An admitted empty index is diagnostic unavailability, never confirmed dry.
    if(u.href==="https://api.rainviewer.com/public/weather-maps.json")
      return jsonResponse({generated:Math.floor(clockNow/1000),host:"https://tilecache.rainviewer.com",radar:{past:[]}},row);
    const day=u.pathname.slice("/v1/timings/".length),expected={latitude:"24.47",longitude:"39.61",method:"4",school:"0"};
    const allowed=u.origin==="https://api.aladhan.com"&&u.pathname.startsWith("/v1/timings/")&&
      Object.entries(expected).every(([k,v])=>u.searchParams.get(k)===v)&&[...u.searchParams.keys()].length===4&&
      (day==="07-09-2026"||day==="08-09-2026");
    if(!allowed){row.result="unexpected-request";failure("Unexpected fixture request: "+u.href);return Promise.reject(Error(report.error));}
    if(mode==="reject"){row.result="rejected";return Promise.reject(Error("Controlled prayer rejection"));}
    if(mode==="hang"){row.result="pending";return new Promise(()=>{});}
    return jsonResponse(prayerFixture(day),row);
  }
  // Serialized as a separate, labeled classic script after the unchanged product bodies.
  // Direct lexical calls work under the fixture CSP; there is no eval or generic execution API.
  function installWeatherBridge(){
    "use strict";
    const control=window.__fixtureClock,report=window.__widgetFixture,copy=value=>value==null?null:JSON.parse(JSON.stringify(value));
    const log=(action,input,result)=>report.weatherEvents.push({action,at:Date.now(),input:copy(input),result:copy(result)});
    const snapshot=()=>({qa:window.qaState(),target:copy(currentWeatherTarget()),
      modelEligible:weatherEligibility(weather).eligible,synthetic:copy(weatherSynthetic),rainOpacity:+getComputedStyle(document.querySelector(".c")).getPropertyValue("--rain-op"),
      icon:document.querySelector("#wi").textContent,temperature:document.querySelector("#wt").textContent});
    window.__smokeWeather=Object.freeze({
      identity:control.identity,
      read(owner){control.assertOwned(owner);const state=snapshot();log("consumer-read",null,state);return state;},
      installModel(owner,current){control.assertOwned(owner);
        const record=admitWeatherRecord(current,{lat,lon,units,zone:tz,retrievedAt:Date.now(),target:currentWeatherTarget()});
        weather=record;render();const result={ok:record!==null,state:snapshot()};log("model-admission",current,result);return result;},
      admitSynthetic(owner,raw){control.assertOwned(owner);const result=admitWeatherFixture(raw,currentWeatherTarget(),Date.now());
        log("synthetic-admission-read",raw,result);return copy(result);},
      installSynthetic(owner,raw){control.assertOwned(owner);
        if(SIM.wx==null&&!ADVANCING){log("synthetic-refused-live",raw,{ok:false,reason:"ordinary live lane"});throw Error("Synthetic installation refused in ordinary live lane");}
        const result=admitWeatherFixture(raw,currentWeatherTarget(),Date.now());weatherSynthetic=result;render();
        const state=snapshot();log("synthetic-admission",raw,{admission:result,state});return {admission:copy(result),state};},
      advanceClock(owner,ms){control.advance(owner,ms);render();const state=snapshot();log("clock-consumer",null,state);return state;},
      nextGeneration(owner){control.assertOwned(owner);beginRuntimeGeneration();render();const state=snapshot();log("target-generation",null,state);return state;}
    });
  }
  async function start(){
    if(!["healthy","reject","hang","bootstrap-error"].includes(mode))throw Error("Unknown fixture mode: "+mode);
    if(!Number.isSafeInteger(attempt)||attempt<1)throw Error("Fixture requires a positive unique attempt");
    if(mode==="bootstrap-error")throw Error("Controlled fixture bootstrap failure before widget parsing");
    const response=await nativeFetch(new URL("index.html",rootURL),{cache:"no-store",credentials:"same-origin"});
    if(!response.ok)throw Error("Widget source fetch HTTP "+response.status);
    const bytes=await response.arrayBuffer(),source=new TextDecoder("utf-8",{fatal:true}).decode(bytes);
    report.sourceSha256=[...new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))].map(b=>b.toString(16).padStart(2,"0")).join("");
    if(!/^<!doctype html>/i.test(source)||!source.includes('<title>Prayer Times</title>'))throw Error("Widget document anchors changed");
    const scripts=[...source.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
    const pre=scripts[1]?.[1].includes('id="native-first-paint-code"')?1:0;
    if(pre){
      const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(scripts[1][2])))].map(b=>b.toString(16).padStart(2,'0')).join('');
      if(!scripts[1][1].includes('data-sha256="'+digest+'"')||!scripts[1][2].includes('function prepareNativeFirstPaint()'))throw Error('First-paint source identity mismatch');
      report.firstPaintSourceSha256=digest;
    }
    const moonScripts=scripts.length===5+pre&&!scripts[3+pre][1].trim()&&scripts[3+pre][2].trim()==='if(location.protocol==="file:")window.__SALAH_MOON_OFFLINE__=true;'&&/^\s+src="moon\/moon-host\.js"\s*$/.test(scripts[4+pre][1]);
    if((scripts.length!==3+pre&&!moonScripts)||!/^\s+src="real-sky\/native-sky\.js"\s*$/.test(scripts[2+pre][1])||!/^\s+src="config\.js"\s*$/.test(scripts[0][1])||scripts[1+pre][1].trim())throw Error("Unreviewed widget script anchors");
    for(const anchor of ["async function fetchTimings(","async function loadPrayerData(","function model(","function render(","window.qaState=function()"])
      if(!scripts[1+pre][2].includes(anchor))throw Error("Missing widget script anchor: "+anchor);
    // These hooks must exist before DOM parsing and before either widget script.
    const data=new Map(),privateStore={
      get length(){return data.size;},key(n){return [...data.keys()][n]??null;},
      getItem(k){k=String(k);report.storageEvents.push(["get",k]);return data.has(k)?data.get(k):null;},
      setItem(k,v){k=String(k);report.storageEvents.push(["set",k]);data.set(k,String(v));},
      removeItem(k){k=String(k);report.storageEvents.push(["remove",k]);data.delete(k);},
      clear(){report.storageEvents.push(["clear"]);data.clear();}
    };
    Object.defineProperty(window,"localStorage",{configurable:true,enumerable:true,get:()=>privateStore});
    if(window.localStorage!==privateStore)throw Error("Cannot isolate localStorage before widget parsing");
    class FixtureDate extends NativeDate{constructor(...args){super(...(args.length?args:[clockNow]));}static now(){return clockNow;}}
    window.Date=FixtureDate;window.fetch=fixtureFetch;
    window.__fixtureClock=Object.freeze({identity,assertOwned,advance(owner,ms){assertOwned(owner);
      if(!Number.isSafeInteger(ms)||ms<0||ms>900001)throw Error("Fixture clock advance must be an integer in 0..900001 ms");
      clockNow+=ms;report.clockNow=clockNow;report.weatherEvents.push({action:"clock-advance",ms,at:clockNow});}});
    report.initialStorageEntries=data.size;
    function verifyHooks(){
      report.storageIsolated=window.localStorage===privateStore;
      report.clockFixed=window.Date===FixtureDate&&Date.now()===clockNow&&+new Date()===clockNow;
      report.fetchIntercepted=window.fetch===fixtureFetch;
      if(!report.storageIsolated||!report.clockFixed||!report.fetchIntercepted)throw Error("Fixture hooks were replaced");
    }
    verifyHooks();
    const doc=new DOMParser().parseFromString(source,"text/html");
    const fonts=new Map([
      ["https://fonts.googleapis.com","preconnect"], ["https://fonts.gstatic.com","preconnect"],
      ["https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap","stylesheet"]
    ]);
    let suppressed=0;
    for(const el of doc.querySelectorAll("link[href]")){const href=el.getAttribute("href"),u=new URL(href,rootURL);
      if(u.origin===rootURL.origin)continue;
      if(fonts.get(href)!==el.getAttribute("rel"))throw Error("Unreviewed external resource anchor: "+href);
      suppressed++;el.remove();
    }
    if(suppressed!==3)throw Error("Expected three known font resource anchors");
    for(const el of doc.querySelectorAll("script[src],img[src],iframe[src],audio[src],video[src],source[src],object[data],embed[src],image[href]")){
      const raw=el.getAttribute("src")||el.getAttribute("href")||el.getAttribute("data");if(!raw)continue;
      const u=new URL(raw,rootURL);if(u.origin!==rootURL.origin&&u.protocol!=="data:")throw Error("Unreviewed external resource anchor: "+raw);
    }
    const base=doc.createElement("base");base.href=rootURL.href;
    const csp=doc.createElement("meta");csp.httpEquiv="Content-Security-Policy";csp.content=policy;
    doc.head.prepend(csp,base);
    let html="<!doctype html>"+doc.documentElement.outerHTML;
    const unchanged=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
    if(unchanged.length!==scripts.length||unchanged.some((s,i)=>s[2]!==scripts[i][2]))throw Error("Widget script body changed during document wrapping");
    const bridge="("+installWeatherBridge.toString()+")();",hook=doc.createElement("script");hook.id="r0017-weather-test-bridge";hook.textContent=bridge;doc.body.append(hook);
    report.bridgeSha256=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(bridge)))].map(b=>b.toString(16).padStart(2,"0")).join("");
    html="<!doctype html>"+doc.documentElement.outerHTML;
    const wrapped=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
    if(wrapped.length!==scripts.length+1||scripts.some((s,i)=>wrapped[i][2]!==s[2])||wrapped[scripts.length][2]!==bridge)throw Error("Unchanged product / labeled bridge identity mismatch");
    report.state="loading";
    document.open();
    window.addEventListener("error",event=>{report.consoleErrors.push(event.message||"Resource/script error");failure(event.message||"Widget resource/script error");});
    window.addEventListener("unhandledrejection",event=>{report.consoleErrors.push(String(event.reason));failure(event.reason);});
    document.addEventListener("securitypolicyviolation",event=>failure("Blocked unexpected resource: "+event.blockedURI));
    document.addEventListener("DOMContentLoaded",()=>{try{
      verifyHooks();if(!window.SalahConfig||typeof window.qaState!=="function"||!window.__smokeWeather)throw Error("Actual widget/config script or test bridge did not initialize");
      if(!report.error)report.state="ready";
    }catch(e){failure(e);}},{once:true});
    document.write(html);document.close();
  }
  start().catch(failure);
})();
</script>
