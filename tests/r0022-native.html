<!doctype html>
<html lang="en"><meta charset="utf-8"><title>R001D / R0022 local native fixture</title>
<style>body{margin:12px;background:#18202d;color:#eee;font:14px sans-serif}iframe{width:325px;height:530px;border:0}pre{white-space:pre-wrap}</style>
<p>Local native fixture. Use <code>await lunarFixture.open({fraction:.01})</code> for a fresh document. Unrun cells remain partial.</p>
<iframe id="widget" title="Pinned lunar fixture" referrerpolicy="no-referrer" scrolling="no"></iframe><pre id="status">Not opened</pre>
<script>
// All overrides below are isolated in the new fixture document. Product source is
// loaded unchanged except replacement of config.js with its exact source and this
// boundary bootstrap. Source SHA256 precedes injection; this is not a public-origin smoke.
const frame=document.getElementById('widget'),statusEl=document.getElementById('status');
let previousBlob=null;
const digest=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))),v=>v.toString(16).padStart(2,'0')).join('');
function boundaries(realTime){
  const NativeDate=Date,epoch=NativeDate.parse('2026-09-08T19:00:00Z');
  if(!realTime)window.Date=class extends NativeDate{constructor(...args){super(...(args.length?args:[epoch]));}static now(){return epoch;}};
  const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)}});
  window.fetch=async url=>{
    if(!String(url).includes('api.aladhan.com/v1/timings/'))throw new Error('fixture denies external JavaScript network');
    const next=String(url).includes('/09-09-2026');
    return {ok:true,json:async()=>({code:200,data:{timings:{Fajr:next?'04:47':'04:46',Sunrise:'06:05',Dhuhr:'12:19',Asr:'15:48',Maghrib:'18:33',Sunset:'18:33',Isha:'20:03'},meta:{timezone:'Asia/Riyadh'},date:{gregorian:{day:next?'9':'8',month:{number:9,en:'September'},year:'2026'},hijri:{day:next?'27':'26',month:{number:3,en:'Rabi'},year:'1448'}}}})};
  };
}
window.lunarFixture={
  async open({fraction=.5,waxing=true,altitude=20,hourAngle=42,time='22:00',layers=[0,8,28],humidity=55,code=2,freeze=true,realTime=false,motion='full',source='../index.html',debugMoon=false,debugOptic=''}={}){
    const sourceUrl=new URL(source,location.href);if(sourceUrl.origin!==location.origin)throw new Error('local source only');
    const [html,config]=await Promise.all([fetch(sourceUrl).then(r=>r.text()),fetch(new URL('config.js',sourceUrl)).then(r=>r.text())]);
    const sourceSha256=await digest(html),configSha256=await digest(config);
    const hash=new URLSearchParams({lat:'24.47',lon:'39.61',tz:'Asia/Riyadh',label:'Madinah',method:'4',units:'c',seed:'1',simWx:String(code),simCloud:'30',simMoon:String(fraction),simWax:waxing?'1':'0',simMoonAlt:String(altitude),simMoonH:String(hourAngle),qa:'1'});
    if(!realTime)hash.set('simTime',time);if(motion)hash.set('motion',motion);if(debugMoon)hash.set('debugMoon','1');if(debugOptic)hash.set('debugOptic',debugOptic);
    const prefix='('+boundaries.toString()+')('+JSON.stringify(realTime)+');\n'+config;
    const injected=html.replace('<script src="config.js"><'+'/script>','<script>'+prefix+'<'+'/script>');
    if(injected===html)throw new Error('config bootstrap anchor missing');
    const blob=URL.createObjectURL(new Blob([injected],{type:'text/html'}));
    frame.src=blob+'#'+hash.toString();if(previousBlob)URL.revokeObjectURL(previousBlob);previousBlob=blob;
    const started=performance.now();let w;
    for(;;){
      w=frame.contentWindow;
      try{if(w.location.hash==='#'+hash.toString()&&w.qaState().cache.prayerLoaded&&w.eval('_pbrReady'))break;}catch(e){}
      if(performance.now()-started>12000)throw new Error('fixture readiness unavailable');await new Promise(r=>setTimeout(r,50));
    }
    await w.document.fonts.ready;
    const weather={code,cloud:30,cloudLow:layers[0],cloudMid:layers[1],cloudHigh:layers[2],precip:0,temp:24,feels:24,rh:humidity,dew:15,vis:20000,wind:3,windDir:225,gust:5,src:'synthetic-native-fixture'};
    w.eval('weather='+JSON.stringify(weather)+';_cloudReady=false;renderMoon();render();paintClouds(simNow()/1000);');
    await new Promise(r=>setTimeout(r,2200));
    if(freeze)for(const a of w.document.getAnimations()){a.pause();a.currentTime=2000;}
    const q=w.qaState(),cs=w.getComputedStyle(w.document.querySelector('.c'));
    const opacities={};for(const key of ['--moonbeam','--mhalo','--mcorona','--mparhelia','--moongrp','--moonocc','--moonfeat'])opacities[key]=cs.getPropertyValue(key).trim();
    const report={sourceUrl:String(sourceUrl),sourceSha256,configSha256,hash:hash.toString(),weather,viewport:{width:innerWidth,height:innerHeight},card:{width:325,height:530},dpr:devicePixelRatio,fonts:w.document.fonts.status,textureReady:w.eval('_pbrReady'),realTime,freeze,moonTruth:q.moonTruth,opacities,localGlow:w.getComputedStyle(w.document.querySelector('.mglow')).opacity,debugReadout:w.document.querySelector('.dbgmoon').textContent};
    window.__lunarNative=report;statusEl.textContent=JSON.stringify(report,null,2);return report;
  }
};
</script></html>
